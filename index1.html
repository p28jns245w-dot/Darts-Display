<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darts Master</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --accent: #00ff88;
            --error: #ff4444;
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column;
        }

        /* 1. SCORE DISPLAY */
        .display-panel {
            background: var(--surface);
            padding: 20px; border-radius: 15px; text-align: center;
            margin-bottom: 10px; border: 1px solid #333;
        }
        #main-score { font-size: 80px; font-weight: bold; line-height: 1; }
        #hint-box { color: var(--accent); font-size: 18px; margin-top: 10px; height: 24px; }
        #input-preview { color: #888; font-size: 24px; margin-top: 5px; }

        /* 2. PLAYER BENCH (4 Slots) */
        .bench { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
        .player-card {
            background: var(--surface); padding: 10px; border-radius: 10px;
            border: 2px solid transparent; opacity: 0.6; transition: 0.3s;
        }
        .active-player { border-color: var(--accent); opacity: 1; transform: scale(1.02); }
        .player-name { font-weight: bold; display: block; margin-bottom: 5px; }
        .score-text { font-size: 24px; }
        .leg-count { float: right; font-size: 12px; color: #888; }

        /* 3. CONTROLS */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex-grow: 1; }
        button {
            background: var(--surface); border: 1px solid #444; color: white;
            font-size: 24px; border-radius: 10px; padding: 15px; transition: 0.1s;
        }
        button:active { background: #333; transform: scale(0.95); }
        .btn-accent { color: var(--accent); border-color: var(--accent); }
        .active-glow { box-shadow: 0 0 15px var(--accent); border-color: var(--accent) !important; color: var(--accent); }

        /* 4. MODAL OVERLAY */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; 
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: var(--surface); padding: 30px; border-radius: 20px; text-align: center; border: 2px solid var(--accent); }
        .modal-btns { display: flex; gap: 20px; margin-top: 20px; }
        .modal-btns button { padding: 10px 30px; flex: 1; }
    </style>
</head>
<body>

    <div class="display-panel">
        <div id="main-score">501</div>
        <div id="hint-box">SET UP</div>
        <div id="input-preview">_</div>
    </div>

    <div class="bench">
        <div id="player-slot-0" class="player-card active-player">
            <span class="leg-count">L: 0</span>
            <span class="player-name">Player 1</span>
            <div class="score-text">501</div>
        </div>
        <div id="player-slot-1" class="player-card">
            <span class="leg-count">L: 0</span>
            <span class="player-name">Player 2</span>
            <div class="score-text">501</div>
        </div>
        <div id="player-slot-2" class="player-card">
            <span class="leg-count">L: 0</span>
            <span class="player-name">Player 3</span>
            <div class="score-text">501</div>
        </div>
        <div id="player-slot-3" class="player-card">
            <span class="leg-count">L: 0</span>
            <span class="player-name">Player 4</span>
            <div class="score-text">501</div>
        </div>
    </div>

    <div class="keypad">
        <button onclick="onNum(1)">1</button><button onclick="onNum(2)">2</button><button onclick="onNum(3)">3</button>
        <button onclick="onNum(4)">4</button><button onclick="onNum(5)">5</button><button onclick="onNum(6)">6</button>
        <button onclick="onNum(7)">7</button><button onclick="onNum(8)">8</button><button onclick="onNum(9)">9</button>
        <button id="dart-toggle-btn" onclick="onToggle()">🎯</button>
        <button onclick="onNum(0)">0</button>
        <button onclick="onDel()">DEL</button>
        <button onclick="onUndo()" style="grid-column: span 1">UNDO</button>
        <button onclick="onEnter()" style="grid-column: span 2" class="btn-accent">ENTER</button>
    </div>

    <div id="win-overlay" class="modal-overlay">
        <div class="modal-content">
            <h2>Double Out?</h2>
            <div class="modal-btns">
                <button onclick="onConfirmWin(true)" class="btn-accent">YES</button>
                <button onclick="onConfirmWin(false)">NO</button>
            </div>
        </div>
    </div>

    <script>
        class DartsEngine {
            constructor(names) {
                this.players = names.map(n => ({ name: n, score: 501, legs: 0, isDartsMode: false }));
                this.currentIdx = 0; this.history = []; this.dartsDone = 0; this.turnStartScore = 501;
                this.validDarts = new Set([0, 25, 50, ...Array.from({length: 21}, (_, i) => i), ...Array.from({length: 21}, (_, i) => i * 2), ...Array.from({length: 21}, (_, i) => i * 3)]);
                this.bogeys = [169, 168, 166, 165, 163, 162, 159];
            }

            submitScore(val) {
                const p = this.players[this.currentIdx];
                return p.isDartsMode ? this._dartMode(val) : this._turnMode(val);
            }

            _turnMode(val) {
                if (val > 180) return { status: "ERR" };
                let rem = this.players[this.currentIdx].score - val;
                if (rem < 0 || rem === 1) return this._bust();
                if (rem === 0) return { status: "WIN" };
                this._save(); this.players[this.currentIdx].score = rem; this._next();
                return { status: "OK" };
            }

            _dartMode(val) {
                if (!this.validDarts.has(val)) return { status: "ERR" };
                let rem = this.players[this.currentIdx].score - val;
                if (rem === 0) return { status: "WIN" };
                if (rem < 0 || rem === 1) return this._bust();
                this._save(); this.players[this.currentIdx].score = rem; this.dartsDone++;
                if (this.dartsDone === 3) this._next();
                return { status: "OK" };
            }

            _bust() { this._save(); this.players[this.currentIdx].score = this.turnStartScore; this._next(); return { status: "BUST" }; }
            _next() { this.currentIdx = (this.currentIdx + 1) % this.players.length; this.dartsDone = 0; this.turnStartScore = this.players[this.currentIdx].score; }
            _save() { this.history.push(JSON.stringify({ players: this.players.map(p => ({...p})), idx: this.currentIdx, start: this.turnStartScore, darts: this.dartsDone })); }
            
            undo() { if (!this.history.length) return; let last = JSON.parse(this.history.pop()); this.players = last.players; this.currentIdx = last.idx; this.turnStartScore = last.start; this.dartsDone = last.darts; }
            
            toggle() { this._save(); let p = this.players[this.currentIdx]; p.isDartsMode = !p.isDartsMode; p.score = this.turnStartScore; this.dartsDone = 0; }
            
            win() { this._save(); this.players[this.currentIdx].legs++; this.players.forEach(p => { p.score = 501; p.isDartsMode = false; }); this.dartsDone = 0; this.turnStartScore = 501; this._next(); }

            getHint(s) {
                if (s > 170 || this.bogeys.includes(s)) return "SET UP";
                if (s === 170) return "T20-T20-BULL";
                if (s <= 40 && s % 2 === 0) return "D" + (s / 2);
                const outs = { 121: "T20-T11-D14", 81: "T19-D12", 60: "S20-D20", 50: "BULL" };
                return outs[s] || "FINISH ON";
            }
        }

        // --- UI BRIDGE ---
        const game = new DartsEngine(["P1", "P2", "P3", "P4"]);
        let input = "";

        function render() {
            const state = game.players[game.currentIdx];
            document.getElementById('main-score').innerText = state.score;
            document.getElementById('hint-box').innerText = game.getHint(state.score);
            document.getElementById('input-preview').innerText = input || "_";
            
            // 🎯 Toggle Glow
            const btn = document.getElementById('dart-toggle-btn');
            state.isDartsMode ? btn.classList.add('active-glow') : btn.classList.remove('active-glow');

            // Bench Update
            game.players.forEach((p, i) => {
                const el = document.getElementById(`player-slot-${i}`);
                el.querySelector('.score-text').innerText = p.score;
                el.querySelector('.leg-count').innerText = "L: " + p.legs;
                i === game.currentIdx ? el.classList.add('active-player') : el.classList.remove('active-player');
            });
        }

        function onNum(n) { input += n; render(); }
        function onDel() { input = input.slice(0, -1); render(); }
        function onUndo() { game.undo(); input = ""; render(); }
        function onToggle() { game.toggle(); render(); }
        function onEnter() {
            if (!input) return;
            const res = game.submitScore(parseInt(input));
            input = "";
            if (res.status === "WIN") document.getElementById('win-overlay').style.display = 'flex';
            render();
        }
        function onConfirmWin(yes) {
            document.getElementById('win-overlay').style.display = 'none';
            yes ? game.win() : game.denyWin ? game.denyWin() : game._bust();
            render();
        }

        render();
    </script>
</body>
</html>
