<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover" />
<title>Darts Master</title>
 
<style>
:root {
  --bg: #0d0d0d;
  --text: #ffffff;
  --accent: #50d890;
  --muted: rgba(255,255,255,0.4);
}
 
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, sans-serif;
  overflow: hidden;
}
 
.app { height: 100dvh; padding: 10px; }
.keypad { display: grid; height: 100%; gap: 8px; }
 
/* =========================================
   SCORE WINDOW (NEW INTERNAL STRUCTURE)
   ========================================= */
.score-view {
  grid-column: span 3;
  display: grid;
  grid-template-columns: 1fr 2fr 1fr; /* left / center / right */
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  padding: 8px;
}
 
/* LEFT: PLAYERS */
.score-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  font-size: 0.9rem;
}
.player {
  color: var(--muted);
}
.player.active {
  color: var(--accent);
  font-weight: 700;
}
 
/* CENTER: SCORE + INFO */
.score-center {
  display: grid;
  grid-template-rows: 1fr 1fr; /* TOP / BOTTOM */
  align-items: center;
  text-align: center;
}
 
.score-main {
  font-size: 120px;
  font-weight: 800;
  line-height: 1;
}
 
.score-meta {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  font-size: 0.9rem;
}
 
.legs {
  justify-self: start;
  color: var(--muted);
}
 
.darts {
  letter-spacing: 6px;
  color: var(--accent);
}
 
.avg {
  justify-self: end;
  color: var(--muted);
}
 
/* RIGHT: HELP */
.score-right {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 0.9rem;
  color: var(--accent);
}
 
/* =========================================
   KEYS (UNCHANGED)
   ========================================= */
.key {
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 700;
}
 
/* Portrait layout (example – reuse your existing grid rules) */
@media (orientation: portrait) {
  .keypad {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 2.5fr repeat(6, 1fr);
  }
  .score-view { grid-column: span 3; }
}
 
/* Landscape layout (example) */
@media (orientation: landscape) {
  .keypad {
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: 2fr repeat(3, 1fr);
  }
  .score-view { grid-column: span 7; }
}
</style>
</head>
 
<body>
<div class="app">
  <div class="keypad">
 
    <!-- SCORE WINDOW -->
    <div class="score-view">
     
      <!-- LEFT -->
      <div class="score-left">
        <div class="player active">P1  501</div>
        <div class="player">P2  501</div>
        <div class="player">P3  501</div>
        <div class="player">P4  501</div>
      </div>
 
      <!-- CENTER -->
      <div class="score-center">
        <div class="score-main">501</div>
        <div class="score-meta">
          <div class="legs">Legs 0</div>
          <div class="darts">○ ○ ○</div>
          <div class="avg">Avg 0.0</div>
        </div>
      </div>
 
      <!-- RIGHT -->
      <div class="score-right">
        SET UP
      </div>
 
    </div>
 
    <!-- KEYS BELOW (placeholder) -->
    <div class="key">1</div><div class="key">2</div><div class="key">3</div>
    <div class="key">4</div><div class="key">5</div><div class="key">6</div>
    <div class="key">7</div><div class="key">8</div><div class="key">9</div>
    <div class="key">DEL</div><div class="key">0</div><div class="key">ENTER</div>
 
  </div>
</div>
</body>
</html>
