<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Darts Master v39 - Snug Lock</title>

<style>
:root {
 --bg: #0d0d0d;
 --text: #ffffff;
 --accent: #50d890;
 --border-std: rgba(255, 255, 255, 0.15);
 --border-red: rgba(255, 75, 92, 0.4);
 --border-amber: rgba(255, 154, 60, 0.4);
 --border-blue: rgba(0, 173, 181, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; touch-action: none; }

.app { width: 100%; height: 100dvh; padding: 10px; display: flex; flex-direction: column; }
.keypad { display: grid; flex: 1; gap: 8px; }

.key {
 background: rgba(255, 255, 255, 0.03);
 border: 1px solid var(--border-std);
 border-radius: 12px;
 display: flex;
 align-items: center;
 justify-content: center;
 font-weight: 700;
 cursor: pointer;
}

.del, .undo { border-color: var(--border-red); color: #ff4b5c; }
.help-btn { border-color: var(--accent); color: var(--accent); }
.bust { border-color: var(--border-amber); color: #ff9a3c; }
.miss { border-color: var(--border-blue); color: #00adb5; }
.enter { border: 2.5px solid var(--accent); color: var(--accent); }
.dart { font-size: 2.5rem !important; }

/* --- UNIVERSAL SCORE VIEW: SHADING REMOVED --- */
.score-view {
 display: grid !important;
 grid-template-columns: repeat(7, 1fr);
 padding: 0 !important;
 overflow: hidden;
 background: rgba(255, 255, 255, 0.03); /* Single flat background for the whole unit */
}

/* Side panels now transparent (no shading boxes) */
.sv-left { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.sv-right { grid-column: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* Mid section handles the vertical lines to prevent gaps */
.sv-mid {
 grid-column: span 3;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 text-align: center;
 border-left: 1px solid var(--border-std);
 border-right: 1px solid var(--border-std);
}

.action-row { display: flex; justify-content: space-between; align-items: center; width: 90%; }
.row-label { font-size: 0.6rem; color: rgba(255,255,255,0.4); text-transform: uppercase; }
.row-val { color: var(--accent); font-weight: bold; font-size: 0.8rem; }
.dart-dots { font-size: 1rem; color: var(--accent); letter-spacing: 4px; }
.bench-p { color: rgba(255,255,255,0.4); line-height: 1.1; margin: 1px 0; }
.active-player { color: var(--accent) !important; font-weight: bold; }

/* --- PORTRAIT --- */
@media (orientation: portrait) {
 .keypad { grid-template-columns: repeat(3, 1fr); grid-template-rows: 2fr 1fr 1fr 1fr 1fr 1.5fr 1fr; }
 .score-view { grid-area: 1 / 1 / 2 / 4; }
 .k1 { grid-area: 2 / 1; } .k2 { grid-area: 2 / 2; } .k3 { grid-area: 2 / 3; }
 .k4 { grid-area: 3 / 1; } .k5 { grid-area: 3 / 2; } .k6 { grid-area: 3 / 3; }
 .k7 { grid-area: 4 / 1; } .k8 { grid-area: 4 / 2; } .k9 { grid-area: 4 / 3; }
 .del { grid-area: 5 / 1; } .k0 { grid-area: 5 / 2; } .undo { grid-area: 5 / 3; }
 .enter { grid-area: 6 / 1 / 7 / 3; } .help-btn { grid-area: 6 / 3 / 7 / 4; }
 .bust { grid-area: 7 / 1; } .miss { grid-area: 7 / 2; } .dart { grid-area: 7 / 3; }
 .score-txt { font-size: 60px; line-height: 1; }
 .num, .k0 { font-size: 42px; }
 .key { font-size: 22px; }
 .bench-p { font-size: 0.7rem; }
}

/* --- LANDSCAPE --- */
@media (orientation: landscape) {
 .keypad { grid-template-columns: repeat(7, 1fr); grid-template-rows: 2.2fr 1fr 1fr 1fr; gap: 10px; }
 .score-view { grid-column: span 7; }
 .k1 { grid-area: 2 / 1; } .k2 { grid-area: 2 / 2; } .k3 { grid-area: 2 / 3; }
 .k4 { grid-area: 3 / 1; } .k5 { grid-area: 3 / 2; } .k6 { grid-area: 3 / 3; }
 .k7 { grid-area: 4 / 1; } .k8 { grid-area: 4 / 2; } .k9 { grid-area: 4 / 3; }
 .k0 { grid-area: 2 / 4 / 4 / 5; }
 .del { grid-area: 2 / 5; } .dart { grid-area: 2 / 6; } .undo { grid-area: 2 / 7; }
 .help-btn { grid-area: 3 / 5; } .bust { grid-area: 3 / 6; } .miss { grid-area: 3 / 7; }
 .enter { grid-area: 4 / 4 / 5 / 8; }

 @media (max-height: 500px) {
   .app { padding: 5px; }
   .score-txt { font-size: 60px; line-height: 0.8; }
   .num, .k0 { font-size: 32px; }
   .key { font-size: 18px; }
 }
}

/* --- IPAD SURGICAL SCALE-UP --- */
@media (min-width: 768px) {
 .key { font-size: 38px; }
 .num, .k0 { font-size: 64px; }
 .dart { font-size: 4rem !important; }
 .bench-p { font-size: 1.2rem; }
 .score-txt { font-size: 120px; }
 .row-label { font-size: 1rem; }
 .row-val { font-size: 1.4rem; }
 .dart-dots { font-size: 1.8rem; letter-spacing: 8px; }
 .dash-label { font-size: 0.9rem; }
 .dash-val { font-size: 1.6rem; }
}
</style>
</head>
<body>
<div class="app">
 <div class="keypad">
   <div class="key score-view">
     <div class="sv-left">
       <div class="bench-p active-player">P1: <b>501</b></div>
       <div class="bench-p">P2: <b>501</b></div>
       <div class="bench-p">P3: <b>501</b></div>
       <div class="bench-p">P4: <b>501</b></div>
     </div>
     <div class="sv-mid">
       <div class="score-txt">501</div>
       <div class="action-row">
         <div><span class="row-label">Legs</span> <span class="row-val">0</span></div>
         <div class="dart-dots">•••</div>
         <div><span class="row-label">Avg</span> <span class="row-val">0.0</span></div>
       </div>
     </div>
     <div class="sv-right">
       <div class="dash-item"><div class="dash-label">Help</div><div class="dash-val">OUT</div></div>
     </div>
   </div>
   <div class="key num k1">1</div><div class="key num k2">2</div><div class="key num k3">3</div>
   <div class="key num k4">4</div><div class="key num k5">5</div><div class="key num k6">6</div>
   <div class="key num k7">7</div><div class="key num k8">8</div><div class="key num k9">9</div>
   <div class="key num k0">0</div>
   <div class="key del">DEL</div>
   <div class="key dart">🎯</div>
   <div class="key undo">UNDO</div>
   <div class="key help-btn">HELP</div>
   <div class="key bust">BUST</div>
   <div class="key miss">MISS</div>
   <div class="key enter">ENTER</div>
 </div>
</div>
</body>
</html>
