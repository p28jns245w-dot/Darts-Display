<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover" />
  <title>Darts Master v39</title>
 
<style>
 
/* =====================================================
   GLOBAL THEME VARIABLES
   ===================================================== */
:root {
  --bg: #0d0d0d;
  --text: #ffffff;
  --accent: #50d890;
  --border-std: rgba(255, 255, 255, 0.15);
  --border-red: rgba(255, 75, 92, 0.4);
  --border-amber: rgba(255, 154, 60, 0.4);
  --border-blue: rgba(0, 173, 181, 0.4);
}
 
/* =====================================================
   GLOBAL BASE
   ===================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, sans-serif;
  overflow: hidden;
  touch-action: none;
}
 
/* =====================================================
   START SCREEN
   ===================================================== */
.start-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
 
.start-card {
  width: 90%;
  max-width: 380px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-std);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
}
 
.start-card h1 {
  margin: 0 0 16px;
  color: var(--accent);
}
 
.group { margin-bottom: 14px; }
 
.group.inline {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
 
label {
  display: block;
  font-size: 0.7rem;
  opacity: 0.6;
  margin-bottom: 4px;
}
 
input, select {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border-std);
  border-radius: 8px;
  padding: 6px;
  color: var(--text);
}
 
.start-btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-weight: 700;
}
 
/* =====================================================
   APP SHELL
   ===================================================== */
.app {
  width: 100%;
  height: 100dvh;
  padding: 10px;
  display: flex;
  flex-direction: column;
}
 
/* =====================================================
   KEYPAD / KEYS
   ===================================================== */
.keypad {
  display: grid;
  flex: 1;
  gap: 8px;
}
 
.key {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border-std);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  cursor: pointer;
}
 
.key.active {
  border-color: var(--accent);
  background: rgba(80,216,144,0.12);
}
 
.del, .undo { border-color: var(--border-red); color: #ff4b5c; }
.help-btn  { border-color: var(--accent); color: var(--accent); }
.bust      { border-color: var(--border-amber); color: #ff9a3c; }
.miss      { border-color: var(--border-blue); color: #00adb5; }
.enter     { border: 2.5px solid var(--accent); color: var(--accent); }
.dart      { font-size: 2.5rem !important; }
 
/* =====================================================
   SCORE WINDOW
   ===================================================== */
.score-view {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  padding: 6px;
}
 
.score-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  font-size: 0.8rem;
}
.score-left .player { color: rgba(255,255,255,0.5); }
.score-left .active { color: var(--accent); font-weight: 700; }
 
.score-center {
  display: grid;
  grid-template-rows: auto 1fr auto;
  text-align: center;
  align-items: center;
}
 
.top-darts {
  display: none;
  color: var(--accent);
  letter-spacing: 2px;
  font-size: 0.6em;
  margin-top: -4px;
}
.dart-mode .top-darts { display: block; }
 
.score-main {
  font-size: clamp(2.6rem, 6.5vw, 3.6rem);
  font-weight: 800;
  line-height: 1;
}
 
.score-meta {
  display: grid;
  grid-template-columns: 0.7fr auto 0.7fr;
  font-size: 0.7em;
  color: rgba(255,255,255,0.45);
}
 
.score-meta .legs,
.score-meta .avg {
  display: flex;
  flex-direction: column;
  align-items: center;
}
 
.score-meta .label {
  font-size: 0.65em;
  opacity: 0.7;
}
 
.score-right {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: clamp(0.75rem, 2.2vw, 0.95rem);
  white-space: nowrap;
}
 
/* =====================================================
   RESPONSIVE LAYOUTS
   ===================================================== */
@media (orientation: portrait) {
  .keypad {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 2.5fr 1fr 1fr 1fr 1fr 1.5fr 1fr;
  }
  .score-view { grid-area: 1 / 1 / 2 / 4; }
}
 
@media (orientation: landscape) {
  .keypad {
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: 2.2fr 1fr 1fr 1fr;
    gap: 10px;
  }
  .score-view { grid-column: span 7; }
}
 
@media (min-width: 768px) {
  .key   { font-size: 1.7rem; }
  .enter { font-size: 1.9rem; }
  .dart  { font-size: 3.4rem !important; }
}
 
</style>
</head>
 
<body>
 
<!-- ================= START SCREEN ================= -->
<div class="start-screen">
  <div class="start-card">
    <h1>Darts Master</h1>
 
    <div class="group">
      <label>Players</label>
      <select id="playerCount">
        <option value="1">1 (Practice)</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>
 
    <div id="playerNames" class="group"></div>
 
    <div class="group inline">
      <div>
        <label>Game</label>
        <select id="startScore">
          <option>101</option>
          <option>301</option>
          <option selected>501</option>
          <option>601</option>
        </select>
      </div>
      <div>
        <label>Legs</label>
        <input id="legsToWin" type="number" value="3" min="1">
      </div>
      <div>
        <label>Sets</label>
        <input id="setsToWin" type="number" value="1" min="1">
      </div>
    </div>
 
    <button class="start-btn">START MATCH</button>
  </div>
</div>
 
<!-- ================= MAIN APP ================= -->
<div class="app">
  <div class="keypad">
 
    <div class="key score-view">
      <div class="score-left"></div>
 
      <div class="score-center">
        <div class="top-darts">○ ○ ○</div>
        <div class="score-main">501</div>
        <div class="score-meta">
          <div class="legs"><div class="label">Legs</div><div>0</div></div>
          <div></div>
          <div class="avg"><div class="label">Avg</div><div>0.0</div></div>
        </div>
      </div>
 
      <div class="score-right">SET UP</div>
    </div>
 
    <div class="key">1</div><div class="key">2</div><div class="key">3</div>
    <div class="key">4</div><div class="key">5</div><div class="key">6</div>
    <div class="key">7</div><div class="key">8</div><div class="key">9</div>
    <div class="key">0</div>
 
    <div class="key del">DEL</div>
    <div class="key dart">🎯</div>
    <div class="key undo">UNDO</div>
    <div class="key help-btn">HELP</div>
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>
    <div class="key enter">ENTER</div>
 
  </div>
</div>
 
<script>
 
/* =====================================================
   GAME OBJECT (CONFIG ONLY — ENGINE/DISPLAY LOCKED)
   ===================================================== */
let game = null;
 
/* =====================================================
   START SCREEN LOGIC
   ===================================================== */
const playerCount = document.getElementById('playerCount');
const startScoreSel = document.getElementById('startScore');
const legsInput = document.getElementById('legsToWin');
const setsInput = document.getElementById('setsToWin');
const namesWrap = document.getElementById('playerNames');
const startScreen = document.querySelector('.start-screen');
const startBtn = document.querySelector('.start-btn');
 
function renderNames() {
  namesWrap.innerHTML = '';
  for (let i = 1; i <= playerCount.value; i++) {
    const input = document.createElement('input');
    input.placeholder = `Player ${i}`;
    namesWrap.appendChild(input);
  }
}
 
playerCount.addEventListener('change', renderNames);
renderNames();
 
startBtn.addEventListener('click', () => {
  const count = Number(playerCount.value);
  const startScore = Number(startScoreSel.value);
  const nameInputs = namesWrap.querySelectorAll('input');
 
  game = {
    mode: count === 1 ? 'practice' : 'match',
    startScore,
    legsToWin: Number(legsInput.value),
    setsToWin: Number(setsInput.value),
    players: [],
    createdAt: Date.now()
  };
 
  const scoreLeft = document.querySelector('.score-left');
  scoreLeft.innerHTML = '';
 
  for (let i = 0; i < count; i++) {
    const name = nameInputs[i]?.value.trim() || `P${i + 1}`;
    game.players.push({ name, score: startScore, legs: 0 });
 
    const div = document.createElement('div');
    div.className = 'player' + (i === 0 ? ' active' : '');
    div.textContent = `${name} - ${startScore}`;
    scoreLeft.appendChild(div);
  }
 
  document.querySelector('.score-main').textContent = startScore;
 
  console.log('Game created:', game); // ✅ testing visibility
  startScreen.style.display = 'none';
});
 
/* =====================================================
   MODE HIGHLIGHTS (DISPLAY ONLY)
   ===================================================== */
const app = document.querySelector('.app');
document.querySelector('.dart').addEventListener('click', e => {
  app.classList.toggle('dart-mode');
  e.currentTarget.classList.toggle('active');
});
 
document.querySelector('.help-btn').addEventListener('click', e => {
  e.currentTarget.classList.toggle('active');
});
 
</script>
 
</body>
</html>
