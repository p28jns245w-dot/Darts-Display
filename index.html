<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Darts Master Pro v43</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --text: #ffffff;
            --accent: #50d890;
            --active-bg: rgba(80, 216, 144, 0.3);
            --border-std: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; touch-action: manipulation; }

        .app { width: 100%; height: 100dvh; padding: 10px; display: flex; flex-direction: column; }
        .keypad { display: grid; flex: 1; gap: 8px; }

        .key { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border-std); 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            transition: background 0.05s, transform 0.05s;
        }
        /* Haptic-Visual Highlight */
        .key:active { 
            background: var(--active-bg) !important; 
            transform: scale(0.95); 
            border-color: var(--accent);
        }

        .score-view { 
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%); 
            border: none; 
            pointer-events: none; 
            position: relative;
        }

        /* Leaderboard Bar - Shows other player scores */
        .leaderboard {
            position: absolute;
            bottom: 10px;
            width: 90%;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }
        .leaderboard .active-p { color: var(--accent); font-weight: bold; }

        .player-tag { font-size: 1.2rem; color: var(--accent); margin-bottom: 5px; letter-spacing: 2px; }
        .typed-val { color: var(--accent); font-size: 1.5rem; height: 1.5rem; margin-bottom: 5px; font-family: monospace; }
        .score-txt { line-height: 1; font-size: clamp(80px, 20vw, 150px); }
        .dart-dots { font-size: 24px; color: var(--accent); letter-spacing: 8px; margin-top: 5px; }

        /* Shared Grid logic */
        @media (orientation: portrait) {
            .keypad { grid-template-columns: repeat(3, 1fr); grid-template-rows: 2.8fr 1fr 1fr 1fr 1fr 1.5fr 1fr; }
            .score-view { grid-area: 1 / 1 / 2 / 4; }
            .enter { grid-area: 6 / 1 / 7 / 3; border: 2px solid var(--accent); font-size: 24px; }
            .num { font-size: 32px; }
        }

        @media (orientation: landscape) {
            .keypad { grid-template-columns: repeat(7, 1fr); grid-template-rows: 1.8fr 1fr 1fr 1fr; gap: 10px; }
            .score-view { grid-column: span 7; }
            .k0 { grid-area: 2 / 4 / 4 / 5; font-size: 60px; } 
            .enter { grid-area: 4 / 4 / 5 / 8; border: 2px solid var(--accent); font-size: 30px; }
            .score-txt { font-size: clamp(60px, 15vh, 180px); }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="keypad">
        <div class="key score-view">
            <div class="player-tag" id="playerTag">---</div>
            <div class="typed-val" id="typedDisplay"></div>
            <div class="score-txt" id="scoreDisplay">---</div>
            <div class="dart-dots" id="dartDots"></div>
            <div class="leaderboard" id="leaderboard"></div>
        </div>
        
        <div class="key num k1" onclick="press('1')">1</div>
        <div class="key num k2" onclick="press('2')">2</div>
        <div class="key num k3" onclick="press('3')">3</div>
        <div class="key num k4" onclick="press('4')">4</div>
        <div class="key num k5" onclick="press('5')">5</div>
        <div class="key num k6" onclick="press('6')">6</div>
        <div class="key num k7" onclick="press('7')">7</div>
        <div class="key num k8" onclick="press('8')">8</div>
        <div class="key num k9" onclick="press('9')">9</div>
        <div class="key num k0" onclick="press('0')">0</div>
        
        <div class="key del" onclick="del()">DEL</div>
        <div class="key undo" onclick="undo()">UNDO</div>
        <div class="key help-btn" onclick="showStats()">STATS</div>
        <div class="key bust" onclick="doBust()" style="color:#ff9a3c">BUST</div>
        <div class="key miss" onclick="doMiss()" style="color:#00adb5">MISS</div>
        <div class="key enter" onclick="enter()">ENTER</div>
    </div>
</div>

<script>
class DartsEngine {
    constructor(playerCount, startScore, bestOf) {
        this.playerCount = playerCount;
        this.startingScore = startScore;
        this.bestOf = bestOf;
        this.players = Array.from({ length: playerCount }, (_, i) => `P${i + 1}`);
        this.scores = Array(playerCount).fill(startScore);
        this.legs = Array(playerCount).fill(0);
        this.totalPoints = Array(playerCount).fill(0);
        this.totalDarts = Array(playerCount).fill(0);
        this.current = 0;
        this.dartsDone = 0;
        this.history = [];
    }

    submitScore(val) {
        if (val > 180) return { status: "ERR" };
        this._saveHistory();
        
        let rem = this.scores[this.current] - val;
        if (rem < 0 || rem === 1) {
            this.totalDarts[this.current] += 3;
            this._nextTurn();
            return { status: "BUST" };
        }

        this.scores[this.current] = rem;
        this.totalPoints[this.current] += val;
        this.totalDarts[this.current] += 3;

        if (rem === 0) {
            this.legs[this.current]++;
            if (this.legs[this.current] >= this.bestOf) return { status: "MATCH_WON" };
            this._resetLeg();
            return { status: "LEG_WON" };
        }

        this._nextTurn();
        return { status: "SUCCESS" };
    }

    _resetLeg() {
        this.scores = Array(this.playerCount).fill(this.startingScore);
        this.current = 0; 
        this.dartsDone = 0;
    }

    _nextTurn() {
        this.current = (this.current + 1) % this.playerCount;
        this.dartsDone = 0;
    }

    _saveHistory() {
        this.history.push(JSON.stringify({
            scores: [...this.scores],
            legs: [...this.legs],
            current: this.current,
            pts: [...this.totalPoints],
            drts: [...this.totalDarts]
        }));
    }

    undo() {
        if (!this.history.length) return;
        let h = JSON.parse(this.history.pop());
        this.scores = h.scores;
        this.legs = h.legs;
        this.current = h.current;
        this.totalPoints = h.pts;
        this.totalDarts = h.drts;
    }
}

let game;
let typedValue = "";

function init() {
    const p = prompt("Players (1-4):", "2") || 2;
    const s = prompt("Game (101-601):", "501") || 501;
    const b = prompt("Best of legs (e.g. 3):", "3") || 3;
    game = new DartsEngine(parseInt(p), parseInt(s), parseInt(b));
    refreshUI();
}

function haptic() {
    if ("vibrate" in navigator) navigator.vibrate(15);
}

function press(n) {
    haptic();
    if (typedValue.length < 3) {
        typedValue += n;
        refreshUI();
    }
}

function del() {
    haptic();
    typedValue = typedValue.slice(0, -1);
    refreshUI();
}

function enter() {
    haptic();
    if (!typedValue) return;
    const res = game.submitScore(parseInt(typedValue));
    
    if (res.status === "BUST") alert("BUST!");
    if (res.status === "LEG_WON") alert("LEG WON!");
    if (res.status === "MATCH_WON") {
        alert("MATCH OVER! " + game.players[game.current] + " WINS!");
        location.reload();
    }
    
    typedValue = "";
    refreshUI();
}

function undo() {
    haptic();
    game.undo();
    refreshUI();
}

function doBust() { haptic(); game.submitScore(0); typedValue = ""; refreshUI(); }
function doMiss() { haptic(); typedValue = "0"; enter(); }

function showStats() {
    let stats = game.players.map((p, i) => {
        let avg = (game.totalPoints[i] / (game.totalDarts[i] / 3 || 1)).toFixed(1);
        return `${p}: Avg ${avg}`;
    }).join('\n');
    alert(stats);
}

function refreshUI() {
    document.getElementById('scoreDisplay').innerText = game.scores[game.current];
    document.getElementById('playerTag').innerText = game.players[game.current];
    document.getElementById('typedDisplay').innerText = typedValue || "---";
    
    // Update Leaderboard
    let lb = document.getElementById('leaderboard');
    lb.innerHTML = game.scores.map((s, i) => {
        let isAct = i === game.current ? 'active-p' : '';
        return `<span class="${isAct}">P${i+1}: ${s} (${game.legs[i]})</span>`;
    }).join('');
}

init();
</script>
</body>
</html>
