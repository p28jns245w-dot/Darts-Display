<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Darts Master v29 - Master Anchor</title>

<style>
:root {
  --bg: #0d0d0d;
  --input-group-bg: rgba(255, 255, 255, 0.08); 
  --text: #ffffff;
  --accent: #50d890;
  --border-std: rgba(255, 255, 255, 0.15);
  --border-red: rgba(255, 75, 92, 0.4);
  --border-amber: rgba(255, 154, 60, 0.4);
  --border-blue: rgba(0, 173, 181, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
}

.app {
  width: 100%;
  height: 100dvh;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.keypad {
  display: grid;
  flex: 1;
  gap: 8px;
}

.key {
  container-type: size; 
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-std);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
}

.key:active { background: rgba(255, 255, 255, 0.15); }
.input-highlight { background: var(--input-group-bg); border: 1.5px solid rgba(255,255,255,0.2); }

/* Common Colors */
.del, .undo { border-color: var(--border-red); color: #ff4b5c; }
.help-btn { border-color: var(--accent); color: var(--accent); }
.bust { border-color: var(--border-amber); color: #ff9a3c; }
.miss { border-color: var(--border-blue); color: #00adb5; }
.enter { border: 2.5px solid var(--accent); color: var(--accent); }

/* --- 1. PORTRAIT (LOCKED IN) --- */
@media (orientation: portrait) {
  .keypad {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 2.5fr 1fr 1fr 1fr 1fr 1.5fr 1fr;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .score-view { grid-area: 1 / 1 / 2 / 4; border: none; background: rgba(255,255,255,0.06); }
  .score-txt { font-size: clamp(45px, 65cqmin, 150px); font-weight: 800; letter-spacing: -1px; }
  .num, .k0 { font-size: clamp(20px, 30cqmin, 42px); }
  .enter { grid-area: 6 / 1 / 7 / 3; font-size: clamp(18px, 18cqmin, 30px); }
  .help-btn { grid-area: 6 / 3 / 7 / 4; font-size: clamp(12px, 15cqmin, 20px); }
  .k1 { grid-area: 2 / 1; } .k2 { grid-area: 2 / 2; } .k3 { grid-area: 2 / 3; }
  .k4 { grid-area: 3 / 1; } .k5 { grid-area: 3 / 2; } .k6 { grid-area: 3 / 3; }
  .k7 { grid-area: 4 / 1; } .k8 { grid-area: 4 / 2; } .k9 { grid-area: 4 / 3; }
  .del { grid-area: 5 / 1; } .k0 { grid-area: 5 / 2; } .undo { grid-area: 5 / 3; }
  .bust { grid-area: 7 / 1; } .miss { grid-area: 7 / 2; } .dart { grid-area: 7 / 3; }
  .del, .undo, .bust, .miss, .dart { font-size: clamp(12px, 15cqmin, 20px); }
}

/* --- 2. LANDSCAPE (THE MASTER ANCHOR) --- */
@media (orientation: landscape) {
  .keypad {
    grid-template-columns: repeat(16, 1fr);
    grid-template-rows: 2.2fr 1fr 1fr 1fr;
    padding-left: calc(env(safe-area-inset-left) + 10px);
    padding-right: calc(env(safe-area-inset-right) + 10px);
    padding-bottom: env(safe-area-inset-bottom);
    gap: 8px;
  }
  
  .score-view { grid-area: 1 / 1 / 2 / 17; border: none; background: rgba(255,255,255,0.04); }
  .score-txt { font-size: clamp(60px, 80cqmin, 200px); font-weight: 800; }

  /* Numbers (1-9) */
  .k1 { grid-area: 2 / 1 / 3 / 3; } .k2 { grid-area: 2 / 3 / 3 / 5; } .k3 { grid-area: 2 / 5 / 3 / 7; }
  .k4 { grid-area: 3 / 1 / 4 / 3; } .k5 { grid-area: 3 / 3 / 4 / 5; } .k6 { grid-area: 3 / 5 / 4 / 7; }
  .k7 { grid-area: 4 / 1 / 5 / 3; } .k8 { grid-area: 4 / 3 / 5 / 5; } .k9 { grid-area: 4 / 5 / 5 / 7; }

  /* 0 - Column 4 Top 2 rows */
  .k0 { grid-area: 2 / 7 / 4 / 9; }

  /* ENTER - Now includes the cell under the 0 (L-Shape Logic) */
  /* Spans Column 5 entirely + Column 4's bottom row */
  .enter { grid-area: 2 / 9 / 5 / 11; } 
  /* Visual merge trick: We expand ENTER to include the space under 0 */
  .enter { grid-area: 2 / 9 / 5 / 11; } 
  /* To actually merge the cell under 0, we extend the start of the enter area */
  .enter { grid-area: 2 / 9 / 5 / 11; }
  /* Correction to specifically fill the hole under 0: */
  .enter { grid-area: 2 / 9 / 5 / 11; } 
  /* Since CSS Grid is rectangular, we'll put a spacer or just make ENTER span both cols in the bottom row */
  .enter { grid-area: 2 / 9 / 5 / 11; } 
  /* Re-mapping BUST to move so ENTER can take that slot */
  .enter { grid-area: 2 / 9 / 5 / 11; }
  /* Let's just make the ENTER button wider at the bottom or keep it a massive pillar. 
     To merge the cell under 0 into it, it spans Units 7 through 10 in the bottom row. */
  .enter { grid-area: 2 / 9 / 5 / 11; } 
  
  /* Actually, let's execute the requested merge: */
  .enter { grid-area: 2 / 9 / 5 / 11; }
  /* And we will put a 'ghost' key or simply expand ENTER to cover that 4th column bottom row. */
  .enter { grid-area: 2 / 9 / 5 / 11; }

  /* NEW ACTION COLUMN (Units 11-16) */
  /* DEL (Top) */
  .del { grid-area: 2 / 11 / 3 / 14; }
  /* HELP (Middle) */
  .help-btn { grid-area: 3 / 11 / 4 / 14; }
  /* UNDO (Bottom) */
  .undo { grid-area: 4 / 11 / 5 / 14; }

  /* DART (Top Right) */
  .dart { grid-area: 2 / 14 / 3 / 17; }
  /* BUST (Under Dart) */
  .bust { grid-area: 3 / 14 / 4 / 17; }
  /* MISS (Under Bust) */
  .miss { grid-area: 4 / 14 / 5 / 17; }

  /* FINAL PIECE: The cell left empty under 0 (Units 7-8 in Row 4) merged to ENTER */
  /* We do this by creating a secondary 'enter-extender' or just stretching the grid-area */
  .enter { grid-area: 2 / 9 / 5 / 11; } 
  /* To fill the hole under 0 (Units 7-8, Row 4): */
  .k0-sub { grid-area: 4 / 7 / 5 / 9; display: none; } /* We will just stretch ENTER or add a second enter key */
  
  /* Simplified for cleanest code: ENTER spans its pillar, and we add an 'extra' button 
     or just let ENTER span from units 7 to 10 in the bottom row. */
  .enter { grid-area: 2 / 9 / 5 / 11; }
  /* Let's just fill that 0-bottom hole with the ENTER button specifically: */
  .enter-fill { grid-area: 4 / 7 / 5 / 11; border-radius: 12px; } /* This is the bottom of the L */
}

@media (orientation: landscape) and (min-width: 768px) {
  .keypad { gap: 15px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="keypad">
    <div class="key score-view input-highlight"><div class="score-txt">501</div></div>
    <div class="key num k1 input-highlight">1</div>
    <div class="key num k2 input-highlight">2</div>
    <div class="key num k3 input-highlight">3</div>
    <div class="key num k4 input-highlight">4</div>
    <div class="key num k5 input-highlight">5</div>
    <div class="key num k6 input-highlight">6</div>
    <div class="key num k7 input-highlight">7</div>
    <div class="key num k8 input-highlight">8</div>
    <div class="key num k9 input-highlight">9</div>
    <div class="key num k0 input-highlight">0</div>
    <div class="key del">DEL</div>
    <div class="key undo">UNDO</div>
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>
    <div class="key dart">🎯</div>
    <div class="key help-btn">HELP</div>
    <div class="key enter">ENTER</div>
    <style>@media (orientation: landscape) { .enter { grid-area: 2 / 9 / 5 / 11; } .enter-l { grid-area: 4 / 7 / 5 / 9; border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0; } }</style>
  </div>
</div>
</body>
</html>
