<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Darts Master v1.37</title>

<style>
:root {
  --bg: #0d0d0d;
  --text: #ffffff;
  --accent: #50d890;
  --border-std: rgba(255, 255, 255, 0.15);
  --border-red: rgba(255, 75, 92, 0.4);
  --border-amber: rgba(255, 154, 60, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, sans-serif;
  overflow: hidden;
  /* Reduced restriction to allow better scrolling on start screen */
  touch-action: none;
 overscroll-behavior: none; 
}

.start-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.start-card {
  width: 90%;
  max-width: 380px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-std);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  max-height: 90dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.start-card h1 {
  margin: 0 0 16px;
  color: var(--accent);
}
.group { margin-bottom: 14px; }
.group.inline {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
label {
  display: block;
  font-size: 0.7rem;
  opacity: 0.6;
  margin-bottom: 4px;
}
input, select {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border-std);
  border-radius: 8px;
  padding: 6px;
  color: var(--text);
}

#playerNames {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#playerNames input {
  padding: 8px;
  font-size: 0.85rem;
}

.start-btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-weight: 700;
}

.app {
  width: 100%;
  height: 100dvh;
  padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
}

.keypad {
  display: grid;
  flex: 1;
  gap: 8px;
}

.key {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-std);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  cursor: pointer;
}
.key.active {
  border-color: var(--accent);
  background: rgba(80, 216, 144, 0.12);
}
.key.pressed {
  background: rgba(80, 216, 144, 0.12);
}

.del, .undo { border-color: var(--border-red); color: #ff4b5c; }
.help-btn  { border-color: var(--accent); color: var(--accent); }
.bust      { border-color: var(--border-amber); color: #ff9a3c; }
.enter     { border: 2.5px solid var(--accent); color: var(--accent); }
.dart      { font-size: 2.5rem !important; }

.score-view {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  padding: 6px;
}

.score-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  font-size: 0.8rem;
}
.score-left .player {
  color: rgba(255,255,255,0.5);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
}
.score-left .active { color: var(--accent); font-weight: 700; }

.score-center {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  text-align: center;
  align-items: center;
}

.top-darts {
  display: none;
  color: var(--accent);
  letter-spacing: 2px;
  font-size: 0.6em;
  line-height: 1;
  margin-top: 8px;
  margin-bottom: 0;
}
.top-darts-left { display: none; width: 100%; text-align: center; margin: 0; }
.score-left.two-col { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: auto; row-gap: 2px; column-gap: 10px; align-content: center; }

.dart-mode .top-darts { display: block; }
.dart-mode .score-meta { position: relative; padding-bottom: 18px; }
.dart-mode .top-darts { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; margin: 0; }
.dart-mode .score-meta { padding-bottom: 0 !important; }
.dart-mode .score-meta .top-darts { display: none !important; }
.dart-mode .score-left { position: relative; padding-top: 16px; }
.dart-mode .top-darts-left { display: block; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); margin: 0; font-size: 0.75em; letter-spacing: 2px; }
.active-name {
  color: var(--accent);
  font-weight: 800;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.05;
  margin-bottom: 8px;
}


.score-main {
  font-size: clamp(2.6rem, 6.5vw, 3.6rem);
  font-weight: 800;
  line-height: 1;
}

.score-meta {
  display: grid;
  grid-template-columns: 0.7fr auto 0.7fr;
  font-size: 0.8em;
  color: rgba(255,255,255,0.45);
  margin-top: 6px;
}
.score-meta .legs,
.score-meta .avg,
.score-meta .sets {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.score-meta .label {
  font-size: 0.65em;
  opacity: 0.7;
  line-height: 1;
}
.score-meta .value { margin-top: 2px; }
.no-stats .score-meta { grid-template-columns: 1fr 1fr; }
.no-stats .score-meta .avg { display: none; }

.score-right {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: clamp(0.75rem, 2.2vw, 0.95rem);
  white-space: nowrap;
  line-height: 1;
}

@media (orientation: portrait) {
 .app { padding: calc(10px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left)); }
 .score-view { padding: 4px; }

  .keypad {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 3fr 1fr 1fr 1fr 1fr 1fr 1fr;
    /* v1.25 iphone portrait fit */
  gap: 6px;
 }
  .score-view { grid-area: 1 / 1 / 2 / 4; }

  .k1 { grid-area: 2 / 1; } .k2 { grid-area: 2 / 2; } .k3 { grid-area: 2 / 3; }
  .k4 { grid-area: 3 / 1; } .k5 { grid-area: 3 / 2; } .k6 { grid-area: 3 / 3; }
  .k7 { grid-area: 4 / 1; } .k8 { grid-area: 4 / 2; } .k9 { grid-area: 4 / 3; }

  .del { grid-area: 5 / 1; } .k0 { grid-area: 5 / 2; } .undo { grid-area: 5 / 3; }
  .enter { grid-area: 6 / 1 / 7 / 4; }
  .bust { grid-area: 7 / 1; } .help-btn { grid-area: 7 / 2; } .dart { grid-area: 7 / 3; }
}

@media (orientation: landscape) {
  .keypad {
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 2.2fr 1fr 1fr 1fr;
    gap: 10px;
  }
  .score-view { grid-column: span 6; }

  .k1 { grid-area: 2 / 1; } .k2 { grid-area: 2 / 2; } .k3 { grid-area: 2 / 3; }
  .k4 { grid-area: 3 / 1; } .k5 { grid-area: 3 / 2; } .k6 { grid-area: 3 / 3; }
  .k7 { grid-area: 4 / 1; } .k8 { grid-area: 4 / 2; } .k9 { grid-area: 4 / 3; }

  .del  { grid-area: 2 / 4; }
  .k0   { grid-area: 3 / 4; }

  .dart { grid-area: 2 / 5; }
  .undo { grid-area: 2 / 6; }

  .help-btn { grid-area: 3 / 5; }
  .bust     { grid-area: 3 / 6; }

  .enter { grid-area: 4 / 4 / 5 / 7; }
}

@media (min-width: 768px) {
  .key   { font-size: 1.9rem; }
  .enter { font-size: 2.1rem; }
  .dart  { font-size: 3.6rem !important; }
}

@media (orientation: landscape) and (max-width: 900px) and (pointer: coarse) {
  /* iphone-landscape-left-dots */
  .score-left { position: relative; padding-top: 0; }
  .dart-mode .top-darts-left { display: block; position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
  .dart-mode .score-meta .top-darts { display: none; }
}
</style>
</head>
<body>

<div class="start-screen" id="startScreen">
  <div class="start-card">
    <h1>Darts Master</h1>

    <div class="group">
      <label>Players</label>
      <select id="playerCount">
        <option value="1">1 (Practice)</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>

    <div id="playerNames" class="group"></div>

    <div class="group inline">
      <div>
        <label>Game</label>
        <select id="startScore">
          <option>101</option>
          <option>201</option>
          <option>301</option>
          <option>401</option>
          <option selected>501</option>
          <option>601</option>
        </select>
      </div>
      <div>
        <label>Legs</label>
        <input id="legsToWin" type="number" value="3" min="1">
      </div>
      <div>
        <label>Sets</label>
        <input id="setsToWin" type="number" value="1" min="1">
      </div>
    </div>

    <div class="group" style="margin-top:10px;">
  <label style="display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; opacity:0.85; margin-bottom:0;">
    <span>Stats / Avg</span>
    <input id="statsToggle" type="checkbox" style="width:auto; transform:scale(1.1);" />
  </label>
</div>
<button class="start-btn" id="startMatch" style="margin-top:4px; background: var(--accent); color:#0d0d0d; border-color: var(--accent);">START MATCH</button>
    <button type="button" class="start-btn" id="openUserOuts" style="margin-top:12px; border-style:solid; border-width:1px; opacity:0.9;">Add User Preferred Out</button>
  </div>
</div>

<div id="userOutsOverlay" class="start-screen" style="display:none; z-index:1100;">
  <div class="start-card" style="max-width:520px;">
    <h1 style="font-size:1.2rem; margin-bottom:10px;">User Preferred Outs</h1>
    <div style="font-size:0.75rem; opacity:0.7; margin-bottom:12px;">Add up to 3 preferred checkout routes. Saved on this device.</div>
    <div id="userOutsList" style="display:flex; flex-direction:column; gap:10px;"></div>
    <div style="border-top:1px solid var(--border-std); margin:12px 0;"></div>
    <div style="display:flex; gap:10px;">
      <button type="button" id="userOutsSave" class="start-btn" style="flex:1; padding:10px;">SAVE</button>
      <button type="button" id="userOutsClose" class="start-btn" style="flex:1; padding:10px; border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.85);">CLOSE</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="keypad">

    <div class="key score-view">
      <div class="score-left"></div>

      <div class="score-center">
 <div class="active-name"></div>
 <div class="score-main">501</div>
 <div class="score-meta">
          <div class="legs"><div class="label">Legs</div><div class="value">0</div>
 <div class="top-darts">● ● ●</div>
</div>
          <div class="avg"><div class="label">Avg</div><div class="value">0.00</div></div>
          <div class="sets"><div class="label">Sets</div><div class="value">0/1</div></div>
        </div>
      </div>

      <div class="score-right">SET UP</div>
    </div>

    <div class="key num k1">1</div><div class="key num k2">2</div><div class="key num k3">3</div>
    <div class="key num k4">4</div><div class="key num k5">5</div><div class="key num k6">6</div>
    <div class="key num k7">7</div><div class="key num k8">8</div><div class="key num k9">9</div>
    <div class="key num k0">0</div>

    <div class="key del">DEL</div>
    <div class="key dart">🎯</div>
    <div class="key undo">UNDO</div>
    <div class="key help-btn">HELP</div>
    <div class="key bust">BUST</div>
    <div class="key enter">ENTER</div>
  </div>
</div>

<script>
// v1.37 integrated build
const sleep = (ms) => new Promise(res => setTimeout(res, ms));
// v1.23: hard lock screen drag/pan
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => { e.preventDefault(); }, { passive: false });

/* ===== Modal (in-app cards) ===== */
const Modal = (() => {
  let overlay, card, titleEl, msgEl, btnRow;
  let active = false;
  const queue = []; // FIFO
  let preemptItem = null; // {req, resolve}

  function ensure() {
    if (overlay) return;
    overlay = document.createElement('div');
    overlay.className = 'start-screen';
    overlay.style.display = 'none';
    overlay.style.zIndex = '2000';

    card = document.createElement('div');
    card.className = 'start-card';
    card.style.maxWidth = '420px';

    titleEl = document.createElement('h1');
    titleEl.style.fontSize = '1.2rem';
    titleEl.style.marginBottom = '10px';

    msgEl = document.createElement('div');
    msgEl.style.fontSize = '0.9rem';
    msgEl.style.opacity = '0.85';
    msgEl.style.marginBottom = '14px';

    btnRow = document.createElement('div');
    btnRow.style.display = 'flex';
    btnRow.style.gap = '12px';

    card.appendChild(titleEl);
    card.appendChild(msgEl);
    card.appendChild(btnRow);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }

  function coalesceKey(req){
    // Optional: coalesce duplicate OK modals (same title+message, single OK button)
    if (!req || !req.buttons || req.buttons.length !== 1) return null;
    const b = req.buttons[0];
    if (b.label !== 'OK') return null;
    return 'OK|' + (req.title || '') + '|' + (req.message || '');
  }

  function render(req, resolve){
    ensure();
    active = true;
    titleEl.textContent = req.title || '';
    msgEl.textContent = req.message || '';
    btnRow.innerHTML = '';
    overlay.style.display = 'flex';

    req.buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'start-btn';
      btn.style.flex = '1';
      btn.style.padding = '12px';
      btn.style.borderColor = b.variant === 'secondary' ? 'rgba(255,255,255,0.25)' : 'var(--accent)';
      btn.style.color = b.variant === 'secondary' ? 'rgba(255,255,255,0.9)' : 'var(--accent)';
      btn.style.background = b.variant === 'primaryFill' ? 'var(--accent)' : 'transparent';
      if (b.variant === 'primaryFill') btn.style.color = '#0d0d0d';
      btn.textContent = b.label;
      btn.addEventListener('click', () => {
        overlay.style.display = 'none';
        active = false;
        resolve(b.value);
        pump();
      }, { once:true });
      btnRow.appendChild(btn);
    });
  }

  function pump(){
    if (active) return;

    // Preempt (MATCH OVER): show next and clear everything pending
    if (preemptItem){
      const item = preemptItem;
      preemptItem = null;
      queue.length = 0;
      render(item.req, item.resolve);
      return;
    }

    if (!queue.length) return;
    const item = queue.shift();
    render(item.req, item.resolve);
  }

  function show(req, opts){
    opts = opts || {};
    ensure();
    const preempt = !!opts.preempt;

    let resolve;
    const promise = new Promise(res => (resolve = res));

    if (preempt){
      preemptItem = { req, resolve };
      queue.length = 0;
      if (!active) pump();
      return promise;
    }

    const key = coalesceKey(req);
    if (key){
      for (const it of queue){
        if (it.key === key) return it.promise;
      }
    }

    queue.push({ req, resolve, key, promise });
    if (!active) pump();
    return promise;
  }

  return {
    yesNo: (title, message='') => show({ title, message, buttons: [
      { label:'YES', value:true, variant:'primaryFill' },
      { label:'NO', value:false, variant:'secondary' }
    ]}),
    ok: (title, message='') => show({ title, message, buttons: [
      { label:'OK', value:true, variant:'primaryFill' }
    ]}),
    pick123: (title, message='') => show({ title, message, buttons: [
      { label:'1', value:1, variant:'primaryFill' },
      { label:'2', value:2, variant:'primaryFill' },
      { label:'3', value:3, variant:'primaryFill' }
    ]}),
 resumeOrNew: (title='RESUME MATCH?', message='') => show({ title, message, buttons: [
  { label:'RESUME', value:'resume', variant:'primaryFill' },
  { label:'NEW MATCH', value:'new', variant:'secondary' }
 ]}),
    matchOver: () => show({ title:'MATCH OVER', message:'', buttons: [
      { label:'NEW MATCH', value:'new', variant:'primaryFill' },
      { label:'REPLAY SAME', value:'replay', variant:'secondary' }
    ]}, { preempt:true })
  };
})();



/* ===== User Preferred Outs ===== */
const USER_OUTS_KEY = 'darts_user_preferred_outs_v1';
function loadUserOuts(){ try { const o = JSON.parse(localStorage.getItem(USER_OUTS_KEY)||'{}'); return (o && typeof o==='object')?o:{}; } catch { return {}; } }
function saveUserOuts(o){ localStorage.setItem(USER_OUTS_KEY, JSON.stringify(o||{})); }

/* ===== Help Engine (from v1.17, cached) ===== */
const HelpEngine = (() => {
  const BOGEY_3D = new Set([159,162,163,165,166,168,169]);
  const ICONIC = { 170:['T20','T20','BULL'], 160:['T20','T20','D20'], 100:['T20','D20'], 40:['D20'], 32:['D16'] };
  const prefFinish = new Map([['D20',40],['D16',34],['D18',28],['D10',18],['D12',16],['BULL',8]]);
  const bullPenalty = 18, iconicBoost = 45, userBoost = 40;

  const checkoutCache = new Map();
  const leaveScoreCache = new Map();
  const setupCache = new Map();

  const THROWS = (() => {
    const out=[];
    for(let n=1;n<=20;n++) out.push({lab:`S${n}`,val:n,type:'S'});
    for(let n=1;n<=20;n++) out.push({lab:`D${n}`,val:2*n,type:'D'});
    for(let n=1;n<=20;n++) out.push({lab:`T${n}`,val:3*n,type:'T'});
    out.push({lab:'SB',val:25,type:'SB'});
    out.push({lab:'BULL',val:50,type:'BULL'});
    out.push({lab:'0',val:0,type:'MISS'});
    return out;
  })();
  const SETUP_THROWS = [
    {lab:'T20',val:60},{lab:'T19',val:57},{lab:'T18',val:54},{lab:'T17',val:51},{lab:'T16',val:48},
    {lab:'T15',val:45},{lab:'T14',val:42},{lab:'T13',val:39},{lab:'T12',val:36},{lab:'T11',val:33},{lab:'T10',val:30},
    {lab:'S20',val:20},{lab:'S19',val:19},{lab:'S18',val:18},{lab:'S17',val:17},{lab:'S16',val:16},{lab:'S15',val:15},
    {lab:'SB',val:25},{lab:'BULL',val:50},{lab:'0',val:0}
  ];
  const isFinishDart = (t)=> t.type==='D' || t.type==='BULL';
  const arraysEqual=(a,b)=>a && b && a.length===b.length && a.every((v,i)=>v===b[i]);

  function coverDepth(finishLab){
    if(!finishLab || finishLab[0] !== 'D') return 0;
    const n = Number(finishLab.slice(1));
    if(!Number.isFinite(n) || n<1 || n>20) return 0;
    let score = 2*n, depth=0;
    while(score%2===0 && score>=4 && score<=40){ depth++; score/=2; if(score===1) break; }
    return depth;
  }

  function routeScore(route, score){
    const n = route.length;
    let s = 1000 - n*250;
    const last = route[n-1];
    s += (prefFinish.get(last) || 0);
    if(last==='BULL') s -= bullPenalty;
    s += coverDepth(last) * 6;
    for(let i=0;i<n;i++){
      if(route[i]==='T20') s += (i===0?10:6);
      if(route[i]==='T19') s += (i===0?7:4);
    }
    const iconic = ICONIC[score];
    if(iconic && arraysEqual(route, iconic)) s += iconicBoost;
    const user = loadUserOuts();
    const u = user[String(score)];
    if(u && arraysEqual(route, u)) s += userBoost;
    return s;
  }

  function genCheckoutRoutes(score, dartsLeft){
    if(score<2 || score>170) return [];
    if(BOGEY_3D.has(score)) return [];
    dartsLeft = Math.max(1, Math.min(3, dartsLeft||3));
    const key = score+'|'+dartsLeft;
    if(checkoutCache.has(key)) return checkoutCache.get(key);

    const routes=[];
    if(dartsLeft>=1){
      for(const a of THROWS){ if(!isFinishDart(a)) continue; if(a.val===score) routes.push([a.lab]); }
    }
    if(dartsLeft>=2){
      for(const a of THROWS) for(const b of THROWS){ if(!isFinishDart(b)) continue; if(a.val+b.val===score) routes.push([a.lab,b.lab]); }
    }
    if(dartsLeft>=3){
      for(const a of THROWS) for(const b of THROWS) for(const c of THROWS){ if(!isFinishDart(c)) continue; if(a.val+b.val+c.val===score) routes.push([a.lab,b.lab,c.lab]); }
    }

    const scored = routes.map(r=>({r,s:routeScore(r,score)})).sort((x,y)=>y.s-x.s);
    const seen=new Set();
    const top=[];
    for(const it of scored){
      const k = it.r.join('|');
      if(seen.has(k)) continue;
      seen.add(k);
      top.push(it.r);
      if(top.length>=3) break;
    }
    checkoutCache.set(key, top);
    return top;
  }

  function leaveScore(leave){
    if(leaveScoreCache.has(leave)) return leaveScoreCache.get(leave);
    const outs = genCheckoutRoutes(leave,3);
    if(!outs.length){ leaveScoreCache.set(leave,-9999); return -9999; }

    const baseScore = (r)=>{
      let s = routeScore(r, leave);
      const iconic = ICONIC[leave];
      if(iconic && arraysEqual(r, iconic)) s -= iconicBoost;
      const user = loadUserOuts();
      const u = user[String(leave)];
      if(u && arraysEqual(r, u)) s -= userBoost;
      return s;
    };
    let best=-9999;
    for(const r of outs) best = Math.max(best, baseScore(r));
    if([170,167,164,161,160,158,157,156,152,151,150,141,140,139,138,137,136,135,132,121,120,110,100,90,80,60,40,36,32].includes(leave)) best+=12;
    if(leave===50) best-=8;
    leaveScoreCache.set(leave, best);
    return best;
  }

  function genSetupSuggestions(score, dartsLeft){
    dartsLeft = Math.max(1, Math.min(3, dartsLeft||3));
    if(score<171 || score>350) return [];
    const key = score+'|'+dartsLeft;
    if(setupCache.has(key)) return setupCache.get(key);

    if(score>=300 && dartsLeft===3){
      const leave180 = score-180;
      if(leave180>1 && leave180<=170 && !BOGEY_3D.has(leave180)){
        const one=[{leave:leave180, route:['T20','T20','T20']}];
        setupCache.set(key, one);
        return one;
      }
      const adjust=[{lab:'T19',val:57},{lab:'T18',val:54},{lab:'T17',val:51},{lab:'T16',val:48}];
      for(const a of adjust){
        const leave = score-(60+60+a.val);
        if(leave>1 && leave<=170 && !BOGEY_3D.has(leave)){
          const one=[{leave, route:['T20','T20',a.lab]}];
          setupCache.set(key, one);
          return one;
        }
      }
      const one=[{leave:score-180, route:['T20','T20','T20']}];
      setupCache.set(key, one);
      return one;
    }

    const cands=[];
    if(dartsLeft===1){
      for(const a of SETUP_THROWS){
        const leave = score-a.val;
        if(leave>1 && leave<=170 && !BOGEY_3D.has(leave)) cands.push({leave, route:[a.lab], s:leaveScore(leave)});
      }
    } else if(dartsLeft===2){
      for(const a of SETUP_THROWS) for(const b of SETUP_THROWS){
        const leave = score-(a.val+b.val);
        if(leave>1 && leave<=170 && !BOGEY_3D.has(leave)) cands.push({leave, route:[a.lab,b.lab], s:leaveScore(leave)});
      }
    } else {
      for(const a of SETUP_THROWS) for(const b of SETUP_THROWS) for(const c of SETUP_THROWS){
        const leave = score-(a.val+b.val+c.val);
        if(leave>1 && leave<=170 && !BOGEY_3D.has(leave)) cands.push({leave, route:[a.lab,b.lab,c.lab], s:leaveScore(leave)});
      }
    }
    cands.sort((x,y)=>y.s-x.s);
    const seen=new Set();
    const top=[];
    for(const it of cands){
      const k2 = it.leave+'|'+it.route.join('|');
      if(seen.has(k2)) continue;
      seen.add(k2);
      top.push({leave:it.leave, route:it.route});
      if(top.length>=3) break;
    }
    setupCache.set(key, top);
    return top;
  }

  function getHelpDisplay(score, dartsLeft){
    if(!Number.isFinite(score)) return {header:'', lines:[]};
    if(score<=170){
      const outs = genCheckoutRoutes(score, dartsLeft);
      if(!outs.length) return {header:'CHECKOUT', lines:['NO OUT']};
      return {header:'CHECKOUT', lines: outs.map(r=>r.join(' '))};
    }
    if(score<=350){
      const sets = genSetupSuggestions(score, dartsLeft);
      if(!sets.length) return {header:'SETUP', lines:[]};
      return {header:'SETUP', lines: sets.map(s=>`${s.route.join(' ')} (${s.leave})`)};
    }
    return {header:'', lines:[]};
  }

  return { getHelpDisplay };
})();

   const n = nodes.length;
   const half = Math.floor((n + 1) / 2);
   const order = [];
   for(let i=0;i<half;i++){
     order.push(i);
     if(i+half < n) order.push(i+half);
   }
   const desired = twoCol ? order : Array.from({length:n},(_,i)=>i);
   desired.forEach(ix => { const el = byIdx.get(ix); if(el) scoreLeft.appendChild(el); });
 }
 items.forEach((el, _pos) => {

  const lToWin = Number(document.getElementById('legsToWin').value);
  const sToWin = Number(document.getElementById('setsToWin').value);
  const nameInputs = namesWrap.querySelectorAll('input');

  undoStack=[];
  game = {
 mode: count===1?'practice':'match',
 statsEnabled: (statsToggle ? !!statsToggle.checked : false),
    startScore,
    legsToWin: lToWin,
    setsToWin: sToWin,
    players: [],
    prefs: [],
    activeIndex: 0,
    legStarterIndex: 0,
    setStarterIndex: 0,
    frozen: false,
    createdAt: Date.now()
  };

  scoreLeft.innerHTML='';
  for(let i=0;i<count;i++){
    const name = nameInputs[i]?.value.trim() || `P${i+1}`;
    const pl = {name, score:startScore, legs:0, sets:0, stats:{points:0,darts:0}};
    game.players.push(pl);
    const div=document.createElement('div');
    div.className='player'+(i===0?' active':'');
 div.dataset.idx = String(i);
 div.textContent = String(startScore);
    scoreLeft.appendChild(div);
  }

  resetPrefsForNewLeg();
  resetVisitState();
  clearInput();

  scoreMain.textContent=startScore;
  legsValueEl.textContent='0';
  avgValueEl.textContent='0.00';
  setsValueEl.textContent=`0/${game.setsToWin}`;

  startScreen.style.display='none';
  applyStatsModeFromGame();
  applyPrefsForPlayer(0);
  refreshUI();
});

btnHelp.addEventListener('click', () => {
  if(!isStarted()) return;
  if(!isPlayable()) return;
  const idx = activeIndex();
  game.prefs[idx].help = !game.prefs[idx].help;
  btnHelp.classList.toggle('active', game.prefs[idx].help);
  renderRightPanel();
});

btnDart.addEventListener('click', () => {
  if(!isStarted()) return;
  if(!isPlayable()) return;
  const idx = activeIndex();
  const pref = game.prefs[idx];
  const newOn = !inDartMode();
  pref.dart = newOn;
  if(!newOn && game.players[idx].score<=170) pref.lock=true;
  setDartMode(newOn);
  renderRightPanel();
});

// keypad
for(const k of document.querySelectorAll('.num')){
  k.addEventListener('click', () => {
    if(!isPlayable()) return;
    const d = k.textContent;
   if(currentInput === '0'){
     if(d !== '0') currentInput = d;
   } else if(currentInput.length < 3){
     currentInput += d;
   }
 updateTypingDisplay();
});
}

document.querySelector('.del').addEventListener('click', () => {
  if(!isPlayable()) return;
  currentInput = currentInput.slice(0,-1);
  updateTypingDisplay();
});

// ENTER

document.querySelector('.enter').addEventListener('click', async () => {
  if(!isPlayable()) return;
  if(!currentInput) return;

  const val = Number(currentInput);
  if(!Number.isFinite(val)) return;

  const idx = activeIndex();
  const p = game.players[idx];

  if(inDartMode()){
  if(!VALID_DART_VALUES.has(val)) { await showInvalidTakeover(); return; }

    pushUndo('dart');
    if(turnStartScore===null) turnStartScore = p.score;

    visitDartsUsed += 1;
    visitPoints += val;

    const newScore = p.score - val;

    if(newScore < 0 || newScore === 1){
      await bustAndAdvance();
      return;
    }

    if(newScore === 0){
      if(!VALID_FINISH_VALUES.has(val)){
        await bustAndAdvance();
        return;
      }

      modalActive=true;
      const ok = await Modal.yesNo('Doubled Out?','');
      modalActive=false;
      if(!ok){
        await bustAndAdvance();
        return;
      }

      if(statsEnabled()) recordVisitStats(idx, visitPoints, visitDartsUsed);
      p.score = 0;
      refreshUI();

      await holdThenAdvance({takeoverText:'CHECKOUT', takeoverColor:'var(--accent)', nextFn:null});
      await awardLegToAsync(idx);
      return;
    }

    p.score = newScore;
    clearInput();
    refreshUI();

    if(visitDartsUsed >= 3){
      if(statsEnabled()) recordVisitStats(idx, visitPoints, 3);
      await advanceToNextPlayerHold();
      return;
    }

    return;
  }

  // visit mode
  if(val<0 || val>180) { await showInvalidTakeover(); return; }

  pushUndo('turn');
  turnStartScore = p.score;
  const newScore = p.score - val;

  if(newScore < 0 || newScore === 1){
    await bustAndAdvance();
    return;
  }

  if(newScore === 0){
    modalActive=true;
    const ok = await Modal.yesNo('Doubled Out?','');
    modalActive=false;
    if(!ok){
      await bustAndAdvance();
      return;
    }

    if(statsEnabled()){
    modalActive=true;
    const dartsUsed = await Modal.pick123('Darts to Checkout?','');
    modalActive=false;
    recordVisitStats(idx, val, dartsUsed);
  }
    p.score = 0;
    clearInput();
    refreshUI();

    await holdThenAdvance({takeoverText:'CHECKOUT', takeoverColor:'var(--accent)', nextFn:null});
    await awardLegToAsync(idx);
    return;
  }

  p.score = newScore;
  if(statsEnabled()) recordVisitStats(idx, val, 3);
  clearInput();
  refreshUI();

  await advanceToNextPlayerHold();
});

// BUST

document.querySelector('.bust').addEventListener('click', async () => {
  if(!isPlayable()) return;
  pushUndo(inDartMode()?'dart':'turn');
  await bustAndAdvance();
});

// UNDO

document.querySelector('.undo').addEventListener('click', async () => {
  if(!isStarted()) return;
  if(holdActive || modalActive) return;

  const item = popUndoForMode();
  if(!item) return;

  if(undoWouldRevertLegOrSet(item.snap.game)){
    modalActive=true;
    const ok = await Modal.yesNo('Undo leg?','');
    modalActive=false;
    if(!ok){ undoStack.push(item); return; }
  }

  restoreUndoSnap(item.snap);
  await showUndoTakeover();
});

// Press flash
for(const btn of document.querySelectorAll('.keypad .key:not(.score-view)')){
  btn.addEventListener('click', () => {
    if(!isPlayable()) return;
    btn.classList.add('pressed');
    setTimeout(()=>btn.classList.remove('pressed'),120);
  });
}

// User outs overlay
const userOutsOverlay = document.getElementById('userOutsOverlay');
const userOutsList = document.getElementById('userOutsList');

document.getElementById('openUserOuts').addEventListener('click', () => { openUserOuts(); });
document.getElementById('userOutsClose').addEventListener('click', () => { closeUserOuts(); });
document.getElementById('userOutsSave').addEventListener('click', () => { saveUserOutsFromUI(); if(isStarted()) refreshUI(); });

function buildUserOutRow(slot, existing){
  const row=document.createElement('div');
  row.style.border='1px solid var(--border-std)';
  row.style.borderRadius='12px';
  row.style.padding='10px';
  row.style.background='rgba(255,255,255,0.03)';
  row.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px;">
      <div style="font-size:0.75rem; opacity:0.75;">Route ${slot+1}</div>
      <input type="number" min="2" max="170" placeholder="Score" style="width:110px;" class="uo-score" />
    </div>
    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
      ${[0,1,2].map(()=>`
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <select class="uo-bed">
            <option value="">-</option>
            <option value="S">S</option>
            <option value="D">D</option>
            <option value="T">T</option>
            <option value="BULL">BULL</option>
          </select>
          <select class="uo-num">
            ${[''].concat(Array.from({length:20},(_,k)=>String(k+1))).map(v=>`<option value="${v}">${v||'-'}</option>`).join('')}
          </select>
        </div>
      `).join('')}
    </div>
  `;

  const scoreInp=row.querySelector('.uo-score');
  const beds=row.querySelectorAll('.uo-bed');
  const nums=row.querySelectorAll('.uo-num');

  if(existing && existing.score) scoreInp.value=existing.score;
  if(existing && existing.route){
    existing.route.forEach((tok,idx)=>{
      if(!beds[idx]||!nums[idx]) return;
      if(tok==='BULL'){ beds[idx].value='BULL'; nums[idx].value=''; }
      else { beds[idx].value=tok[0]; nums[idx].value=tok.slice(1); }
    });
  } else {
    beds.forEach(b=>b.value='');
    nums.forEach(n=>n.value='');
  }

  function syncDisable(){
    beds.forEach((b,idx)=>{
      if(b.value==='BULL'){ nums[idx].value=''; nums[idx].disabled=true; }
      else nums[idx].disabled=false;
    });
  }
  beds.forEach(b=>b.addEventListener('change', syncDisable));
  syncDisable();

  return row;
}

function openUserOuts(){
  userOutsList.innerHTML='';
  const existing=loadUserOuts();
  const entries=Object.keys(existing).slice(0,3).map(k=>({score:k, route:existing[k]}));
  while(entries.length<3) entries.push(null);
  entries.forEach((e,i)=>userOutsList.appendChild(buildUserOutRow(i,e)));
  userOutsOverlay.style.display='flex';
}
function closeUserOuts(){ userOutsOverlay.style.display='none'; }
function saveUserOutsFromUI(){
  const rows=Array.from(userOutsList.children);
  const out={};
  for(const row of rows){
    const scoreVal=row.querySelector('.uo-score').value;
    if(!scoreVal) continue;
    const s=Number(scoreVal);
    if(!Number.isFinite(s)||s<2||s>170) continue;

    const beds=row.querySelectorAll('.uo-bed');
    const nums=row.querySelectorAll('.uo-num');
    const route=[];

    for(let i=0;i<3;i++){
      const bed=beds[i]?.value||'';
      const num=nums[i]?.value||'';
      if(!bed) continue;
      if(bed==='BULL') route.push('BULL');
      else {
        const n=Number(num);
        if(!Number.isFinite(n)||n<1||n>20){ route.length=0; break; }
        route.push(bed+String(n));
      }
    }

    if(route.length) out[String(s)] = route;
  }
  saveUserOuts(out);
  closeUserOuts();
}

</script>
