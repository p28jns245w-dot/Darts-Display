<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Darts Display Mock v3</title>

<style>
:root {
  --bg: #0d0d0d;
  --panel: #1a1a1a;
  --border: rgba(255,255,255,0.1);
  --text: #ffffff;
  --muted: #888;
  --accent: #50d890;
  
  --num: #222;
  --red: #4a1a1a;
  --amber: #4a3a1a;
  --blue: #1a2a4a;
  --green: #1a4a1a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
}

.app {
  width: 100%;
  height: 100dvh; /* Dynamic height to combat address bar */
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.player-window {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 15px;
  text-align: center;
}

.score {
  font-size: 4rem;
  font-weight: 300;
  margin: 0;
}

/* --- THE MASTER GRID --- */
.keypad {
  display: grid;
  gap: 8px;
  flex: 1; /* Fills remaining space exactly */
  grid-template-columns: repeat(3, 1fr); /* Default Portrait */
}

.key {
  background: var(--num);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  padding: 5px;
}

.key:active { background: #444; }

/* Colors */
.enter { background: var(--green); border-color: #50d890; }
.del, .undo { background: var(--red); }
.bust { background: var(--amber); }
.miss { background: var(--blue); }
.dart { background: #333; font-size: 0.9rem; }
.advice-btn { background: #111; color: var(--accent); font-size: 0.9rem; }

/* --- LANDSCAPE ADJUSTMENTS --- */
@media (orientation: landscape) {
  .player-window { display: none; }

  .keypad {
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(4, 1fr); /* 4 rows to fit the big Enter at bottom */
  }

  /* Numbers 1-9 */
  .k1 { grid-area: 1 / 1; } .k2 { grid-area: 1 / 2; } .k3 { grid-area: 1 / 3; }
  .k4 { grid-area: 2 / 1; } .k5 { grid-area: 2 / 2; } .k6 { grid-area: 2 / 3; }
  .k7 { grid-area: 3 / 1; } .k8 { grid-area: 3 / 2; } .k9 { grid-area: 3 / 3; }

  /* 0 takes the old Enter spot (Tall, 2 rows) */
  .k0 { grid-area: 1 / 4 / 3 / 5; }

  /* Action Buttons Right Side */
  .del  { grid-area: 1 / 5; }
  .undo { grid-area: 1 / 6; }
  .dart { grid-area: 2 / 5; }
  .bust { grid-area: 2 / 6; }
  .miss { grid-area: 3 / 5; }
  .advice-btn { grid-area: 3 / 6; }

  /* Giant Enter Button at the Bottom */
  .enter { grid-area: 4 / 1 / 5 / 7; }

  /* Empty 7th column for spacing/edge safety */
}

/* Portrait Specific Spanning */
@media (orientation: portrait) {
  .enter { grid-column: span 3; padding: 20px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="player-window">
    <div class="player-name">Player 1</div>
    <div class="score">501</div>
  </div>

  <div class="keypad">
    <div class="key num k1">1</div>
    <div class="key num k2">2</div>
    <div class="key num k3">3</div>
    <div class="key num k4">4</div>
    <div class="key num k5">5</div>
    <div class="key num k6">6</div>
    <div class="key num k7">7</div>
    <div class="key num k8">8</div>
    <div class="key num k9">9</div>
    
    <div class="key del">DEL</div>
    <div class="key num k0">0</div>
    <div class="key undo">UNDO</div>
    
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>
    <div class="key dart">DART ↔ DART</div>
    <div class="key advice-btn">ADVICE</div>

    <div class="key enter">ENTER</div>
  </div>
</div>

</body>
</html>
