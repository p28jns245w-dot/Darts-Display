<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Darts Master Final Layout</title>

<style>
:root {
  --bg: #0d0d0d;
  --input-group-bg: rgba(255, 255, 255, 0.08); 
  --text: #ffffff;
  --accent: #50d890;
  --border-std: rgba(255, 255, 255, 0.15);
  --border-red: rgba(255, 75, 92, 0.4);
  --border-amber: rgba(255, 154, 60, 0.4);
  --border-blue: rgba(0, 173, 181, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
}

.app {
  width: 100%;
  height: 100dvh;
  padding: 12px;
  display: flex;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}

.keypad {
  display: grid;
  flex: 1;
  gap: 10px;
}

.key {
  container-type: size; 
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-std);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
}

.key:active { background: rgba(255, 255, 255, 0.15); }

.input-highlight {
  background: var(--input-group-bg);
  border: 1.5px solid rgba(255,255,255,0.2);
}

/* --- DYNAMIC TEXT SCALING --- */

/* NUMBERS: Scaled down for Phone (#1), scaled up for iPad (#3/4) */
.num, .k0 {
  font-size: clamp(24px, 32cqmin, 90px); 
}

/* SCORE WINDOW */
.score-txt { font-size: clamp(40px, 50cqmin, 130px); font-weight: 200; }

/* ENTER: Scaled up for iPad (#3/4) */
.enter { 
  border: 2.5px solid var(--accent); 
  color: var(--accent); 
  font-size: clamp(20px, 24cqmin, 75px); 
}

/* ACTION BUTTONS: DEL, UNDO, HELP, BUST, MISS 
   Uniformly scaled based on a better-fitting UNDO (#1/2)
   Increased for iPad (#3/4) */
.del, .undo, .help-btn, .bust, .miss {
  font-size: clamp(12px, 18cqmin, 40px); 
}

.del, .undo { border-color: var(--border-red); color: #ff4b5c; }
.help-btn { border-color: var(--accent); color: var(--accent); }
.bust { border-color: var(--border-amber); color: #ff9a3c; }
.miss { border-color: var(--border-blue); color: #00adb5; }

.dart { font-size: clamp(24px, 35cqmin, 80px); }

/* --- GRID LAYOUTS --- */

@media (orientation: portrait) {
  .keypad {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(9, 1fr);
  }
  .score-view { grid-area: 1 / 1 / 3 / 4; border: none; background: rgba(255,255,255,0.06); }
  .k1 { grid-area: 3 / 1; } .k2 { grid-area: 3 / 2; } .k3 { grid-area: 3 / 3; }
  .k4 { grid-area: 4 / 1; } .k5 { grid-area: 4 / 2; } .k6 { grid-area: 4 / 3; }
  .k7 { grid-area: 5 / 1; } .k8 { grid-area: 5 / 2; } .k9 { grid-area: 5 / 3; }
  .del { grid-area: 6 / 1; } .k0 { grid-area: 6 / 2; } .undo { grid-area: 6 / 3; }
  .enter { grid-area: 7 / 1 / 9 / 3; }
  .help-btn { grid-area: 7 / 3 / 9 / 4; }
  .bust { grid-area: 9 / 1; } .miss { grid-area: 9 / 2; } .dart { grid-area: 9 / 3; }
}

@media (orientation: landscape) {
  .keypad {
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(3, 1fr);
    /* 28px Offset for Island (#2) */
    padding-left: 28px; 
    padding-right: 28px; 
  }
  .score-view { display: none; }
  
  .k1 { grid-area: 1 / 1; } .k2 { grid-area: 1 / 2; } .k3 { grid-area: 1 / 3; }
  .k4 { grid-area: 2 / 1; } .k5 { grid-area: 2 / 2; } .k6 { grid-area: 2 / 3; }
  .k7 { grid-area: 3 / 1; } .k8 { grid-area: 3 / 2; } .k9 { grid-area: 3 / 3; }
  .k0 { grid-area: 1 / 4 / 3 / 5; }
  .del { grid-area: 1 / 5; } .undo { grid-area: 1 / 6; } .dart { grid-area: 1 / 7; }
  .bust { grid-area: 2 / 5; } .miss { grid-area: 2 / 6; } .help-btn { grid-area: 2 / 7; }
  .enter { grid-area: 3 / 4 / 4 / 8; }
}
</style>
</head>
<body>

<div class="app">
  <div class="keypad">
    <div class="key score-view input-highlight"><div class="score-txt">501</div></div>
    
    <div class="key num k1 input-highlight">1</div>
    <div class="key num k2 input-highlight">2</div>
    <div class="key num k3 input-highlight">3</div>
    <div class="key num k4 input-highlight">4</div>
    <div class="key num k5 input-highlight">5</div>
    <div class="key num k6 input-highlight">6</div>
    <div class="key num k7 input-highlight">7</div>
    <div class="key num k8 input-highlight">8</div>
    <div class="key num k9 input-highlight">9</div>
    <div class="key num k0 input-highlight">0</div>
    
    <div class="key del">DEL</div>
    <div class="key undo">UNDO</div>
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>
    <div class="key dart">🎯</div>
    <div class="key help-btn">HELP</div>
    <div class="key enter">ENTER</div>
  </div>
</div>

</body>
</html>
