<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Darts Display Mock</title>

<style>
:root {
  --bg:#111;
  --panel:#1a1a1a;
  --border:#2a2a2a;
  --text:#fff;
  --muted:#9a9a9a;
  --accent:#7fdc7f;

  --num:#2a2a2a;
  --red:#3a1f1f;
  --amber:#3a321f;
  --blue:#1f2f3a;
  --green:#243a24;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden; /* Prevents bounce on mobile */
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 12px;
  /* Use dvh to account for the dynamic address bar */
  height: 100vh; 
  height: 100dvh; 
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-sizing: border-box; /* Crucial to keep padding inside the height calculation */
}


/* PLAYER WINDOW */
.player-window {
  background:var(--panel);
  border:2px solid var(--border);
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.player-name {
  font-size:1.2rem;
  color:var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.score {
  font-size:5.2rem;
  font-weight:bold;
  margin:4px 0;
  line-height:1;
}

.advice {
  font-size:1rem;
  color:var(--accent);
  font-weight: 600;
}

/* KEYPAD */
.keypad {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  flex: 1; /* Allow keypad to grow */
}

.key {
  background:var(--num);
  border:2px solid var(--border);
  border-radius:14px;
  font-size:1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}

.key:active {
  background: #333;
  transform: scale(0.98);
}

/* ENTER */
.key.enter {
  grid-column:span 3;
  font-size:1.7rem;
  background:#3f6f3f;
  border-color:#6fcf6f;
}

/* DELETE / UNDO */
.key.del, .key.undo {
  background:var(--red);
  border-color:#6a2a2a;
}

/* BOTTOM CONTROLS */
.bottom {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
}

.ctrl {
  border:2px solid var(--border);
  border-radius:14px;
  padding:15px 0;
  font-size:0.9rem;
  text-align:center;
  font-weight: bold;
}

.ctrl.bust { background:var(--amber); border-color:#6a5a2a; }
.ctrl.miss { background:var(--blue); border-color:#2a4a6a; }
.ctrl.dart { background:var(--green); border-color:#2a6a2a; }
.ctrl.advice { background:#222; color:var(--accent); border-color:#2a6a2a; }

/* TABLET/TV ADJUSTMENTS */
@media (min-width:768px) {
  .app { max-width:720px; gap:16px; }
  .score { font-size:6rem; }
}

@media (min-width: 1200px) {
  .app { max-width: 1100px; padding: 40px; }
  .score { font-size: 9rem; }
  .key { font-size: 2.2rem; }
}

/* LANDSCAPE/CONTROLLER MODE */
@media (orientation: landscape) and (max-height: 500px) {
  .app { flex-direction: row; max-width: 100%; }
  .player-window { display: none; } /* Focus only on input */
  .keypad { grid-template-columns: repeat(6, 1fr); }
  .key.enter { grid-column: span 2; }
}

</style>
</head>
<body>

<div class="app">
  <div class="player-window" id="display-panel">
    <div class="player-name">Player 1</div>
    <div class="score">501</div>
    <div class="advice">SET UP D20</div>
  </div>

  <div class="keypad">
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key">4</div>
    <div class="key">5</div>
    <div class="key">6</div>
    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key del">DEL</div>
    <div class="key">0</div>
    <div class="key undo">UNDO</div>
    <div class="key enter">ENTER</div>
  </div>

  <div class="bottom">
    <div class="ctrl bust">BUST</div>
    <div class="ctrl miss">MISS</div>
    <div class="ctrl dart">DART ↔ DART</div>
    <div class="ctrl advice">ADVICE</div>
  </div>
</div>

<script>
  const DisplayMode = {
    NORMAL: "normal",
    CONTROLLER: "controller"
  };

  const playerWindow = document.getElementById("display-panel");

  function detectDisplayMode() {
    // If screen is wide but window is small, assume it's a controller for a second screen
    const isLandscape = window.innerWidth > window.innerHeight;
    const isSmallHeight = window.innerHeight < 500;
    
    return (isLandscape && isSmallHeight) ? DisplayMode.CONTROLLER : DisplayMode.NORMAL;
  }

  function applyMode() {
    const mode = detectDisplayMode();
    if (mode === DisplayMode.CONTROLLER) {
      playerWindow.style.display = "none";
    } else {
      playerWindow.style.display = "block";
    }
  }

  window.addEventListener("resize", applyMode);
  applyMode();
</script>

</body>
</html>
