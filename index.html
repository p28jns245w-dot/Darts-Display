<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Darts Pro v44 - 5 Col Layout</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --text: #ffffff;
            --accent: #50d890;
            --dim-text: rgba(255, 255, 255, 0.4);
            --active-bg: rgba(80, 216, 144, 0.2);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }

        .app { width: 100%; height: 100dvh; padding: 10px; display: flex; flex-direction: column; }
        .keypad { display: grid; flex: 1; gap: 8px; }

        /* THE 5-COLUMN SCOREBOARD */
        .score-view { 
            grid-column: span 5; 
            display: grid;
            grid-template-columns: 1fr 3fr 1fr; /* Logic: Sidebar | Main | Data */
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Col 1: Opponents */
        .sidebar-opponents {
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10px;
            gap: 10px;
        }
        .opp-card { font-size: 0.9rem; color: var(--dim-text); }
        .opp-card b { color: #fff; font-size: 1.1rem; display: block; }

        /* Col 2-4: Main Stage */
        .main-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .player-name { color: var(--accent); font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; }
        .big-score { font-size: clamp(70px, 18vw, 140px); font-weight: 800; line-height: 1; margin: 5px 0; }
        .typed-preview { color: var(--accent); font-family: monospace; font-size: 1.5rem; height: 1.5rem; }

        /* Col 5: Help/Stats */
        .data-wing {
            background: rgba(255, 255, 255, 0.02);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
        }
        .stat-label { font-size: 0.7rem; color: var(--dim-text); text-transform: uppercase; margin-top: 10px; }
        .stat-val { font-size: 1.1rem; font-weight: bold; color: var(--accent); }

        /* KEYPAD LOGIC */
        .key { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; font-weight: 700;
        }
        .key:active { background: var(--active-bg); transform: scale(0.96); border-color: var(--accent); }

        @media (orientation: portrait) {
            .keypad { grid-template-columns: repeat(5, 1fr); grid-template-rows: 2.5fr repeat(5, 1fr); }
            .num { grid-column: span 1; }
            .enter { grid-column: span 3; grid-row: span 2; background: rgba(80, 216, 144, 0.1); border: 2px solid var(--accent); }
            .wide { grid-column: span 2; }
        }

        @media (orientation: landscape) {
            .keypad { grid-template-columns: repeat(5, 1fr); grid-template-rows: 1.8fr repeat(3, 1fr); }
            .enter { grid-column: 4 / 6; grid-row: 3 / 5; border: 2px solid var(--accent); }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="keypad">
        <div class="score-view">
            <div class="sidebar-opponents" id="oppList"></div>
            
            <div class="main-stage">
                <div class="player-name" id="curName">PLAYER 1</div>
                <div class="typed-preview" id="typedVal"></div>
                <div class="big-score" id="curScore">501</div>
                <div id="dartDots" style="color:var(--accent); letter-spacing:5px;"></div>
            </div>

            <div class="data-wing">
                <div class="stat-label">Average</div>
                <div class="stat-val" id="curAvg">0.0</div>
                <div class="stat-label">Best Of</div>
                <div class="stat-val" id="matchTarget">3</div>
                <div class="stat-label">Check</div>
                <div class="stat-val" id="checkout">--</div>
            </div>
        </div>

        <div class="key num" onclick="press('1')">1</div>
        <div class="key num" onclick="press('2')">2</div>
        <div class="key num" onclick="press('3')">3</div>
        <div class="key num" onclick="press('4')">4</div>
        <div class="key num" onclick="press('5')">5</div>
        <div class="key num" onclick="press('6')">6</div>
        <div class="key num" onclick="press('7')">7</div>
        <div class="key num" onclick="press('8')">8</div>
        <div class="key num" onclick="press('9')">9</div>
        <div class="key del" onclick="del()">DEL</div>
        <div class="key num" onclick="press('0')">0</div>
        <div class="key undo" onclick="undo()" style="color:#ff4b5c">UNDO</div>
        <div class="key wide bust" onclick="doBust()" style="color:#ff9a3c">BUST</div>
        <div class="key enter" onclick="enter()">ENTER</div>
        <div class="key wide miss" onclick="doMiss()" style="color:#00adb5">MISS</div>
    </div>
</div>

<script>
// Engine is initialized via init prompts
class DartsEngine {
    constructor(pCount, start, best) {
        this.pCount = pCount;
        this.start = start;
        this.best = best;
        this.scores = Array(pCount).fill(start);
        this.legs = Array(pCount).fill(0);
        this.points = Array(pCount).fill(0);
        this.darts = Array(pCount).fill(0);
        this.current = 0;
        this.history = [];
    }

    submit(val) {
        if (val > 180) return "ERR";
        this.history.push(JSON.stringify({s:[...this.scores], l:[...this.legs], c:this.current, p:[...this.points], d:[...this.darts]}));
        
        let res = this.scores[this.current] - val;
        if (res < 0 || res === 1) {
            this.darts[this.current] += 3;
            this.current = (this.current + 1) % this.pCount;
            return "BUST";
        }

        this.scores[this.current] = res;
        this.points[this.current] += val;
        this.darts[this.current] += 3;

        if (res === 0) {
            this.legs[this.current]++;
            if (this.legs[this.current] >= this.best) return "MATCH_WIN";
            this.scores = Array(this.pCount).fill(this.start);
            this.current = 0;
            return "LEG_WIN";
        }
        this.current = (this.current + 1) % this.pCount;
        return "OK";
    }

    undo() {
        if (this.history.length) {
            let h = JSON.parse(this.history.pop());
            this.scores = h.s; this.legs = h.l; this.current = h.c; this.points = h.p; this.darts = h.d;
        }
    }
}

let game;
let typed = "";

function init() {
    const p = prompt("Players (1-4):", "2") || 2;
    const s = prompt("Score (101-601):", "501") || 501;
    const b = prompt("Best of legs:", "3") || 3;
    game = new DartsEngine(parseInt(p), parseInt(s), parseInt(b));
    refresh();
}

function haptic() { if (navigator.vibrate) navigator.vibrate(15); }

function press(n) { haptic(); if (typed.length < 3) { typed += n; refresh(); } }
function del() { haptic(); typed = typed.slice(0,-1); refresh(); }
function undo() { haptic(); game.undo(); refresh(); }
function doBust() { haptic(); game.submit(0); typed = ""; refresh(); }
function doMiss() { haptic(); typed = "0"; enter(); }

function enter() {
    haptic();
    if (!typed) return;
    const res = game.submit(parseInt(typed));
    if (res === "MATCH_WIN") { alert("MATCH OVER!"); location.reload(); }
    typed = "";
    refresh();
}

function getOut(s) {
    if (s > 170 || s < 2 || [169,168,166,165,163,162,159].includes(s)) return "--";
    if ((s <= 40 && s % 2 === 0) || s === 50) return "D" + (s === 50 ? "B" : s/2);
    return "OUT";
}

function refresh() {
    document.getElementById('curScore').innerText = game.scores[game.current];
    document.getElementById('curName').innerText = `Player ${game.current + 1}`;
    document.getElementById('typedVal').innerText = typed || "---";
    document.getElementById('matchTarget').innerText = game.best;
    document.getElementById('curAvg').innerText = (game.points[game.current] / (game.darts[game.current]/3 || 1)).toFixed(1);
    document.getElementById('checkout').innerText = getOut(game.scores[game.current]);

    // Update Opponent Sidebar
    let oppHtml = "";
    game.scores.forEach((s, i) => {
        if (i !== game.current) {
            oppHtml += `<div class="opp-card">P${i+1} <b>${s}</b> <small>Legs: ${game.legs[i]}</small></div>`;
        }
    });
    document.getElementById('oppList').innerHTML = oppHtml;
}

init();
</script>
</body>
</html>
