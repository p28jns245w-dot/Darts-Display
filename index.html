 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darts Master v39</title>
 
<style>
 
/* ===============================
   ROOT THEME
   =============================== */
:root{
  --bg:#0d0d0d;
  --text:#ffffff;
  --accent:#50d890;
  --border-std:rgba(255,255,255,.15);
  --border-red:rgba(255,75,92,.4);
  --border-amber:rgba(255,154,60,.4);
  --border-blue:rgba(0,173,181,.4);
}
 
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,sans-serif;
  overflow:hidden;
  touch-action:none;
}
 
/* ===============================
   START SCREEN
   =============================== */
.start-screen{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.start-card{
  width:90%;
  max-width:380px;
  padding:20px;
  border-radius:16px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-std);
  text-align:center;
}
.start-card h1{
  margin-bottom:16px;
  color:var(--accent);
}
.group{margin-bottom:14px;}
.group.inline{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
label{
  font-size:.7rem;
  opacity:.6;
  margin-bottom:4px;
  display:block;
}
input,select{
  width:100%;
  background:transparent;
  color:var(--text);
  border:1px solid var(--border-std);
  border-radius:8px;
  padding:6px;
}
.start-btn{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:2px solid var(--accent);
  background:transparent;
  color:var(--accent);
  font-weight:700;
}
 
/* ===============================
   APP
   =============================== */
.app{
  width:100%;
  height:100dvh;
  padding:10px;
  display:flex;
  flex-direction:column;
}
 
/* ===============================
   KEYPAD
   =============================== */
.keypad{
  flex:1;
  display:grid;
  gap:8px;
}
 
/* ===============================
   KEYS
   =============================== */
.key{
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:700;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border-std);
  border-radius:12px;
  cursor:pointer;
}
.key.active{
  border-color:var(--accent);
  background:rgba(80,216,144,.12);
}
.del,.undo{border-color:var(--border-red);color:#ff4b5c;}
.help-btn{border-color:var(--accent);color:var(--accent);}
.bust{border-color:var(--border-amber);color:#ff9a3c;}
.miss{border-color:var(--border-blue);color:#00adb5;}
.enter{border:2.5px solid var(--accent);color:var(--accent);}
.dart{font-size:2.5rem!important;}
 
/* ===============================
   SCORE WINDOW
   =============================== */
.score-view{
  grid-column:span 7;
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  padding:6px;
}
.score-left{
  font-size:.8rem;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.score-left .player{opacity:.5;}
.score-left .active{opacity:1;color:var(--accent);}
.score-center{
  display:grid;
  grid-template-rows:auto 1fr auto;
  align-items:center;
  text-align:center;
}
.top-darts{
  display:none;
  font-size:.6em;
  letter-spacing:2px;
  margin-top:-4px;
  color:var(--accent);
}
.dart-mode .top-darts{display:block;}
.score-main{
  font-size:clamp(2.6rem,6.5vw,3.6rem);
  font-weight:800;
  line-height:1;
}
.score-meta{
  display:grid;
  grid-template-columns:.7fr auto .7fr;
  font-size:.7em;
  opacity:.7;
}
.score-meta .legs,
.score-meta .avg{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.score-right{
  display:flex;
  justify-content:center;
  align-items:center;
  white-space:nowrap;
  font-size:clamp(.75rem,2.2vw,.95rem);
  color:var(--accent);
}
 
/* ===============================
   LAYOUTS
   =============================== */
@media(orientation:portrait){
  .keypad{
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:2.5fr 1fr 1fr 1fr 1fr 1.5fr 1fr;
  }
}
 
@media(orientation:landscape){
  .keypad{
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:2.2fr 1fr 1fr 1fr;
    gap:10px;
  }
}
 
@media(min-width:768px){
  .key{font-size:1.7rem;}
  .enter{font-size:1.9rem;}
  .dart{font-size:3.4rem!important;}
}
 
</style>
</head>
 
<body>
 
<!-- START SCREEN -->
<div class="start-screen">
  <div class="start-card">
    <h1>Darts Master</h1>
 
    <div class="group">
      <label>Players</label>
      <select id="playerCount">
        <option value="1">1 (Practice)</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
    </div>
 
    <div id="playerNames" class="group"></div>
 
    <div class="group inline">
      <div>
        <label>Game</label>
        <select id="startScore">
          <option>101</option>
          <option>201</option>
          <option>301</option>
          <option>401</option>
          <option selected>501</option>
          <option>601</option>
        </select>
      </div>
      <div>
        <label>Legs</label>
        <input id="legsToWin" type="number" value="3">
      </div>
      <div>
        <label>Sets</label>
        <input id="setsToWin" type="number" value="1">
      </div>
    </div>
 
    <button class="start-btn">START MATCH</button>
  </div>
</div>
 
<!-- APP -->
<div class="app">
  <div class="keypad">
 
    <div class="key score-view">
      <div class="score-left"></div>
      <div class="score-center">
        <div class="top-darts">○ ○ ○</div>
        <div class="score-main">501</div>
        <div class="score-meta">
          <div class="legs">
            <div>Legs</div><div>0</div>
          </div>
          <div></div>
          <div class="avg">
            <div>Avg</div><div>0.0</div>
          </div>
        </div>
      </div>
      <div class="score-right">SET UP</div>
    </div>
 
    <!-- KEYPAD (RESTORED) -->
    <div class="key num k1">1</div><div class="key num k2">2</div><div class="key num k3">3</div>
    <div class="key num k4">4</div><div class="key num k5">5</div><div class="key num k6">6</div>
    <div class="key num k7">7</div><div class="key num k8">8</div><div class="key num k9">9</div>
    <div class="key num k0">0</div>
 
    <div class="key del">DEL</div>
    <div class="key dart">🎯</div>
    <div class="key undo">UNDO</div>
    <div class="key help-btn">HELP</div>
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>
    <div class="key enter">ENTER</div>
 
  </div>
</div>
 
<script>
 
/* ===============================
   GAME (CONFIG ONLY)
   =============================== */
let game=null;
 
/* ===============================
   START SCREEN LOGIC
   =============================== */
const playerCount=document.getElementById('playerCount');
const namesWrap=document.getElementById('playerNames');
const startScreen=document.querySelector('.start-screen');
const scoreLeft=document.querySelector('.score-left');
const scoreMain=document.querySelector('.score-main');
 
function renderNames(){
  namesWrap.innerHTML='';
  for(let i=1;i<=playerCount.value;i++){
    const input=document.createElement('input');
    input.placeholder=`Player ${i}`;
    namesWrap.appendChild(input);
  }
}
playerCount.addEventListener('change',renderNames);
renderNames();
 
document.querySelector('.start-btn').onclick=()=>{
  const startScore=Number(document.getElementById('startScore').value);
  const nameInputs=namesWrap.querySelectorAll('input');
 
  game={
    startScore,
    players:[],
    createdAt:Date.now()
  };
 
  scoreLeft.innerHTML='';
  nameInputs.forEach((inp,i)=>{
    const name=inp.value||`P${i+1}`;
    game.players.push({name,score:startScore});
    const div=document.createElement('div');
    div.className='player'+(i===0?' active':'');
    div.textContent=`${name} - ${startScore}`;
    scoreLeft.appendChild(div);
  });
 
  scoreMain.textContent=startScore;
  startScreen.style.display='none';
  console.log('Game:',game);
};
 
/* ===============================
   NUMERIC INPUT (DISPLAY ONLY)
   =============================== */
let currentInput='';
document.querySelectorAll('.num').forEach(k=>{
  k.onclick=()=>{
    if(currentInput.length<3){
      currentInput+=k.textContent;
      scoreMain.textContent=currentInput;
    }
  };
});
document.querySelector('.del').onclick=()=>{
  currentInput=currentInput.slice(0,-1);
  scoreMain.textContent=currentInput || game?.startScore || '0';
};
 
/* ===============================
   MODE HIGHLIGHTS
   =============================== */
const app=document.querySelector('.app');
document.querySelector('.dart').onclick=e=>{
  app.classList.toggle('dart-mode');
  e.currentTarget.classList.toggle('active');
};
document.querySelector('.help-btn').onclick=e=>{
  e.currentTarget.classList.toggle('active');
};
 
</script>
 
</body>
</html>
