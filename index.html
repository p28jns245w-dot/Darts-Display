<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Darts Display Mock v10</title>

<style>
:root {
  --bg: #0d0d0d;
  --panel: #1a1a1a;
  --text: #ffffff;
  --accent: #50d890; /* Green */
  
  --border-std: rgba(255, 255, 255, 0.15);
  --border-red: rgba(255, 75, 92, 0.4);
  --border-amber: rgba(255, 154, 60, 0.4);
  --border-blue: rgba(0, 173, 181, 0.4);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
}

.app {
  width: 100%;
  height: 100dvh;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: env(safe-area-inset-bottom);
}

.key {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-std);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.1s ease;
}

.key:active { 
  background: rgba(255, 255, 255, 0.1);
  transform: scale(0.97);
}

/* Specific Outlines */
.score-view { background: var(--panel); border: 1px solid var(--border-std); border-radius: 16px; }
.score-txt { font-size: 3.5rem; font-weight: 200; }

.enter { 
  border: 2px solid var(--accent); 
  color: var(--accent);
  background: rgba(80, 216, 144, 0.05);
  font-size: 1.4rem; 
}

.del, .undo { border-color: var(--border-red); color: #ff4b5c; }
.bust { border-color: var(--border-amber); color: #ff9a3c; }
.miss { border-color: var(--border-blue); color: #00adb5; }
.advice-btn { border-color: var(--accent); color: var(--accent); font-size: 0.85rem; }

/* THE DART BUTTON (Graphical Icon) */
.dart { 
  border-color: var(--border-std); 
  color: var(--accent); /* Tint the SVG to match advice/accent */
}
.dart svg { 
  display: block; 
  height: 60%; 
  width: auto; 
}

/* --- GRID LOGIC --- */
@media (orientation: portrait) {
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 8px;
    flex: 1;
  }
  .score-view { grid-area: 1 / 1 / 3 / 4; }
  .k1 { grid-area: 3 / 1; } .k2 { grid-area: 3 / 2; } .k3 { grid-area: 3 / 3; }
  .k4 { grid-area: 4 / 1; } .k5 { grid-area: 4 / 2; } .k6 { grid-area: 4 / 3; }
  .k7 { grid-area: 5 / 1; } .k8 { grid-area: 5 / 2; } .k9 { grid-area: 5 / 3; }
  .del { grid-area: 6 / 1; } .k0 { grid-area: 6 / 2; } .undo { grid-area: 6 / 3; }
  .enter { grid-area: 7 / 1 / 9 / 3; }
  .advice-btn { grid-area: 7 / 3 / 9 / 4; }
  .bust { grid-area: 9 / 1; } .miss { grid-area: 9 / 2; } .dart { grid-area: 9 / 3; }
}

@media (orientation: landscape) {
  .keypad {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    flex: 1;
  }
  .score-view { display: none; }
  .k1 { grid-area: 1 / 1; } .k2 { grid-area: 1 / 2; } .k3 { grid-area: 1 / 3; }
  .k4 { grid-area: 2 / 1; } .k5 { grid-area: 2 / 2; } .k6 { grid-area: 2 / 3; }
  .k7 { grid-area: 3 / 1; } .k8 { grid-area: 3 / 2; } .k9 { grid-area: 3 / 3; }
  .k0 { grid-area: 1 / 4 / 3 / 5; }
  .del { grid-area: 1 / 5; } .undo { grid-area: 1 / 6; } .dart { grid-area: 1 / 7; }
  .bust { grid-area: 2 / 5; } .miss { grid-area: 2 / 6; } .advice-btn { grid-area: 2 / 7; }
  .enter { grid-area: 3 / 4 / 4 / 8; }
}
</style>
</head>
<body>

<div class="app">
  <div class="keypad">
    <div class="key score-view"><div class="score-txt">501</div></div>
    <div class="key num k1">1</div>
    <div class="key num k2">2</div>
    <div class="key num k3">3</div>
    <div class="key num k4">4</div>
    <div class="key num k5">5</div>
    <div class="key num k6">6</div>
    <div class="key num k7">7</div>
    <div class="key num k8">8</div>
    <div class="key num k9">9</div>
    <div class="key num k0">0</div>
    <div class="key del">DEL</div>
    <div class="key undo">UNDO</div>
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>
    
    <div class="key dart">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11.5 1.5L2.5 6M11.5 1.5L20.5 6M11.5 1.5V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M13.5 1.5L22.5 6M13.5 1.5L4.5 6M13.5 1.5V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M12.5 22.5L12.5 11M12.5 11L18.5 16M12.5 11L6.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <div class="key advice-btn">ADVICE</div>
    <div class="key enter">ENTER</div>
  </div>
</div>

</body>
</html>
