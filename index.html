<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Darts Master v30 - Wide Numbers</title>

<style>
:root {
  --bg: #0d0d0d;
  --input-group-bg: rgba(255, 255, 255, 0.08); 
  --text: #ffffff;
  --accent: #50d890;
  --border-std: rgba(255, 255, 255, 0.15);
  --border-red: rgba(255, 75, 92, 0.4);
  --border-amber: rgba(255, 154, 60, 0.4);
  --border-blue: rgba(0, 173, 181, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
}

.app {
  width: 100%;
  height: 100dvh;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.keypad {
  display: grid;
  flex: 1;
  gap: 8px;
}

.key {
  container-type: size; 
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-std);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
}

.key:active { background: rgba(255, 255, 255, 0.15); }
.input-highlight { background: var(--input-group-bg); border: 1.5px solid rgba(255,255,255,0.2); }

/* Common Colors */
.del, .undo { border-color: var(--border-red); color: #ff4b5c; }
.help-btn { border-color: var(--accent); color: var(--accent); }
.bust { border-color: var(--border-amber); color: #ff9a3c; }
.miss { border-color: var(--border-blue); color: #00adb5; }
.enter { border: 2.5px solid var(--accent); color: var(--accent); }

/* --- 1. PORTRAIT (LOCKED IN) --- */
@media (orientation: portrait) {
  .keypad {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 2.5fr 1fr 1fr 1fr 1fr 1.5fr 1fr;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .score-view { grid-area: 1 / 1 / 2 / 4; border: none; background: rgba(255,255,255,0.06); }
  .score-txt { font-size: clamp(45px, 65cqmin, 150px); font-weight: 800; letter-spacing: -1px; }
  .num, .k0 { font-size: clamp(20px, 30cqmin, 42px); }
  .enter { grid-area: 6 / 1 / 7 / 3; font-size: clamp(18px, 18cqmin, 30px); }
  .help-btn { grid-area: 6 / 3 / 7 / 4; font-size: clamp(12px, 15cqmin, 20px); }
  .k1 { grid-area: 2 / 1; } .k2 { grid-area: 2 / 2; } .k3 { grid-area: 2 / 3; }
  .k4 { grid-area: 3 / 1; } .k5 { grid-area: 3 / 2; } .k6 { grid-area: 3 / 3; }
  .k7 { grid-area: 4 / 1; } .k8 { grid-area: 4 / 2; } .k9 { grid-area: 4 / 3; }
  .del { grid-area: 5 / 1; } .k0 { grid-area: 5 / 2; } .undo { grid-area: 5 / 3; }
  .bust { grid-area: 7 / 1; } .miss { grid-area: 7 / 2; } .dart { grid-area: 7 / 3; }
  .del, .undo, .bust, .miss, .dart { font-size: clamp(12px, 15cqmin, 20px); }
}

/* --- 2. LANDSCAPE (16-UNIT GRID FOR 1.5x NUMBERS) --- */
@media (orientation: landscape) {
  .keypad {
    grid-template-columns: repeat(16, 1fr);
    grid-template-rows: 2.2fr 1fr 1fr 1fr;
    padding-left: calc(env(safe-area-inset-left) + 10px);
    padding-right: calc(env(safe-area-inset-right) + 10px);
    padding-bottom: env(safe-area-inset-bottom);
    gap: 8px;
  }
  
  .score-view { grid-area: 1 / 1 / 2 / 17; border: none; background: rgba(255,255,255,0.04); }
  .score-txt { font-size: clamp(60px, 80cqmin, 200px); font-weight: 800; }

  /* Numbers (1-9) - 1.5 Columns Wide (3 units) */
  .k1 { grid-area: 2 / 1 / 3 / 4; } .k2 { grid-area: 2 / 4 / 3 / 7; } .k3 { grid-area: 2 / 7 / 3 / 10; }
  .k4 { grid-area: 3 / 1 / 4 / 4; } .k5 { grid-area: 3 / 4 / 4 / 7; } .k6 { grid-area: 3 / 7 / 4 / 10; }
  .k7 { grid-area: 4 / 1 / 5 / 4; } .k8 { grid-area: 4 / 4 / 5 / 7; } .k9 { grid-area: 4 / 7 / 5 / 10; }

  /* 0 - Stacks next to 3 & 6 (Top 2 rows, Units 10-12) */
  .k0 { grid-area: 2 / 10 / 4 / 13; }

  /* ENTER - Pillar spanning all 3 rows (Units 13-14) + Row 4 cell under 0 (Units 10-12) */
  .enter { grid-area: 2 / 13 / 5 / 15; }
  /* Expanding ENTER into the cell under the 0 */
  .enter-l { grid-area: 4 / 10 / 5 / 13; display: flex; border-right: none; border-radius: 12px 0 0 12px; }

  /* ACTION PILLARS (Units 15-16 - 1x1 Grid) */
  .del { grid-area: 2 / 15 / 3 / 17; }
  .help-btn { grid-area: 3 / 15 / 4 / 17; }
  .undo { grid-area: 4 / 15 / 5 / 17; }

  /* Second Action Column (Floating beside/under things) */
  /* Actually, to keep it 8 cols, we will move BUST/MISS/DART inside. */
  .dart { grid-area: 2 / 10 / 3 / 13; display:none; } /* Placeholder for layout */
  
  /* Redrawing for the 1x1 requests: */
  .del { grid-area: 2 / 15 / 3 / 16; }
  .dart { grid-area: 2 / 16 / 3 / 17; }
  
  .help-btn { grid-area: 3 / 15 / 4 / 16; }
  .bust { grid-area: 3 / 16 / 4 / 17; }
  
  .undo { grid-area: 4 / 15 / 5 / 16; }
  .miss { grid-area: 4 / 16 / 5 / 17; }

  .num, .k0 { font-size: clamp(20px, 32cqmin, 55px); }
  .enter { font-size: clamp(16px, 20cqmin, 35px); }
  .bust, .miss, .del, .undo, .dart, .help-btn { font-size: clamp(12px, 14cqmin, 18px); }
}

@media (orientation: landscape) and (min-width: 768px) {
  .keypad { gap: 15px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="keypad">
    <div class="key score-view input-highlight"><div class="score-txt">501</div></div>
    <div class="key num k1 input-highlight">1</div>
    <div class="key num k2 input-highlight">2</div>
    <div class="key num k3 input-highlight">3</div>
    <div class="key num k4 input-highlight">4</div>
    <div class="key num k5 input-highlight">5</div>
    <div class="key num k6 input-highlight">6</div>
    <div class="key num k7 input-highlight">7</div>
    <div class="key num k8 input-highlight">8</div>
    <div class="key num k9 input-highlight">9</div>
    <div class="key num k0 input-highlight">0</div>
    <div class="key del">DEL</div>
    <div class="key undo">UNDO</div>
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>
    <div class="key dart">🎯</div>
    <div class="key help-btn">HELP</div>
    <div class="key enter">ENTER</div>
    <div class="key enter enter-l" style="background: transparent; border-right: none; position: relative; z-index: -1;"></div>
  </div>
</div>
</body>
</html>
