<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Darts Display Mock v4</title>

<style>
:root {
  --bg: #0d0d0d;
  --panel: #1a1a1a;
  --border: rgba(255,255,255,0.1);
  --text: #ffffff;
  --muted: #888;
  --accent: #50d890;
  
  --num: #222;
  --red: #4a1a1a;
  --amber: #4a3a1a;
  --blue: #1a2a4a;
  --green: #1a4a1a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, system-ui, sans-serif;
  overflow: hidden;
  touch-action: none;
}

.app {
  width: 100%;
  height: 100dvh;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player-window {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px;
  text-align: center;
}

.score {
  font-size: 3.5rem;
  font-weight: 300;
  margin: 0;
}

/* --- THE MASTER GRID --- */
.keypad {
  display: grid;
  gap: 8px;
  flex: 1;
}

.key {
  background: var(--num);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  padding: 4px;
}

.key:active { filter: brightness(1.4); }

.enter { background: var(--green); border-color: var(--accent); }
.del, .undo { background: var(--red); }
.bust { background: var(--amber); }
.miss { background: var(--blue); }
.dart { background: #333; font-size: 0.85rem; }
.advice-btn { background: #111; color: var(--accent); font-size: 0.85rem; }

/* --- PORTRAIT (Simple Stack) --- */
@media (orientation: portrait) {
  .keypad {
    grid-template-columns: repeat(3, 1fr);
  }
  .enter { grid-column: span 3; }
  .bust, .miss, .dart, .advice-btn { display: flex; } /* Shown in portrait too */
}

/* --- LANDSCAPE (Your Specific 7x4 Request) --- */
@media (orientation: landscape) {
  .player-window { display: none; }

  .keypad {
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }

  /* 3x3 Numbers (Columns 1-3) */
  .k1 { grid-area: 1 / 1; } .k2 { grid-area: 1 / 2; } .k3 { grid-area: 1 / 3; }
  .k4 { grid-area: 2 / 1; } .k5 { grid-area: 2 / 2; } .k6 { grid-area: 2 / 3; }
  .k7 { grid-area: 3 / 1; } .k8 { grid-area: 3 / 2; } .k9 { grid-area: 3 / 3; }

  /* 0 is Tall next to 3 and 6 (Column 4, Rows 1-2) */
  .k0 { grid-area: 1 / 4 / 3 / 5; }

  /* Enter runs under 0, next to 9, and under all actions */
  /* This starts at Column 4 and goes to the end */
  .enter { grid-area: 3 / 4 / 5 / 8; }

  /* 6 Actions (Columns 5-6, Rows 1-3) */
  .del  { grid-area: 1 / 5; }
  .undo { grid-area: 1 / 6; }
  .dart { grid-area: 2 / 5; }
  .advice-btn { grid-area: 2 / 6; }
  .bust { grid-area: 1 / 7; } /* Using the 7th column for actions to fill space */
  .miss { grid-area: 2 / 7; }
  
  /* Row 4 Padding / Clean Finish */
  /* If you want the Enter button even wider, we adjust the grid-area above */
}
</style>
</head>
<body>

<div class="app">
  <div class="player-window">
    <div class="score">501</div>
  </div>

  <div class="keypad">
    <div class="key num k1">1</div>
    <div class="key num k2">2</div>
    <div class="key num k3">3</div>
    <div class="key num k4">4</div>
    <div class="key num k5">5</div>
    <div class="key num k6">6</div>
    <div class="key num k7">7</div>
    <div class="key num k8">8</div>
    <div class="key num k9">9</div>
    
    <div class="key num k0">0</div>
    
    <div class="key del">DEL</div>
    <div class="key undo">UNDO</div>
    <div class="key dart">DART ↔ DART</div>
    <div class="key advice-btn">ADVICE</div>
    <div class="key bust">BUST</div>
    <div class="key miss">MISS</div>

    <div class="key enter">ENTER</div>
  </div>
</div>

</body>
</html>
